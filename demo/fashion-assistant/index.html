<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fashion Lab · AI 导购助手 Demo</title>
<style>
  :root {
    --ink:#171717;
    --muted:#767676;
    --line:#e7e2da;
    --paper:#faf8f4;
    --card:#ffffff;
    --soft:#f1eadf;
    --accent:#111111;
    --hot:#ff3f7f;
    --green:#377b56;
    --blue:#eaf2ff;
    --shadow:0 24px 70px rgba(24,20,16,.16);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Microsoft YaHei",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family:var(--font);
    color:var(--ink);
    background:
      linear-gradient(90deg, rgba(226,220,210,.72) 1px, transparent 1px),
      linear-gradient(180deg, rgba(226,220,210,.62) 1px, transparent 1px),
      #f7f4ee;
    background-size:32px 32px;
  }
  a { color:inherit; text-decoration:none; }
  button, input { font:inherit; }
  button { cursor:pointer; }
  .topbar {
    height:56px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 22px;
    background:rgba(255,255,255,.88);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:10;
    backdrop-filter:blur(14px);
  }
  .back {
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    display:grid;
    place-items:center;
    font-size:22px;
    font-weight:700;
  }
  .brand { font-weight:850; font-size:20px; letter-spacing:-.1px; }
  .status {
    margin-left:auto;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:7px 12px;
    color:#555;
    font-size:13px;
    font-weight:750;
  }
  .status i { width:8px; height:8px; border-radius:50%; background:var(--green); display:block; }
  .stage {
    min-height:calc(100vh - 56px);
    display:grid;
    place-items:start center;
    padding:28px 18px 42px;
  }
  .phone {
    width:min(390px, 100%);
    border:8px solid #111;
    border-radius:30px;
    background:#fbfaf8;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .screen {
    height:780px;
    overflow:auto;
    background:#fbfaf8;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar { width:0; height:0; }
  .phone-head {
    height:42px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    font-size:11px;
    font-weight:850;
    background:rgba(251,250,248,.96);
    position:sticky;
    top:0;
    z-index:5;
  }
  .phone-head .time { margin-right:auto; }
  .phone-head .title { position:absolute; left:0; right:0; text-align:center; pointer-events:none; }
  .nav-btn {
    width:26px;
    height:26px;
    border:0;
    background:transparent;
    border-radius:50%;
    font-size:18px;
    font-weight:850;
    display:grid;
    place-items:center;
    z-index:1;
  }
  .icon-text { border:0; background:transparent; font-size:11px; font-weight:850; z-index:1; }
  .hero {
    margin:0 12px 12px;
    min-height:164px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#ddd;
  }
  img { display:block; width:100%; height:100%; object-fit:cover; }
  .hero::after, .tryon-hero::after {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.52));
  }
  .hero-copy {
    position:absolute;
    left:14px;
    right:14px;
    bottom:14px;
    z-index:1;
    color:#fff;
  }
  .hero-copy h1 { margin:0; font-size:24px; line-height:1.02; letter-spacing:-.3px; }
  .hero-copy p { margin:6px 0 0; font-size:12px; opacity:.95; }
  .ask {
    margin:0 12px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    padding:8px 9px 8px 13px;
  }
  .ask input {
    min-width:0;
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:#333;
    font-size:12px;
  }
  .round {
    width:28px;
    height:28px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-weight:950;
    display:grid;
    place-items:center;
  }
  .quick-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:0 12px 16px;
  }
  .quick {
    min-height:48px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    padding:9px 10px;
    text-align:left;
    font-size:11px;
    font-weight:850;
  }
  .quick span { display:block; color:var(--muted); font-weight:700; margin-top:1px; }
  .section-title {
    margin:18px 14px 10px;
    font-size:13px;
    font-weight:900;
  }
  .style-stack { display:grid; gap:10px; padding:0 12px; }
  .style-card {
    display:grid;
    grid-template-columns:1fr 100px;
    gap:10px;
    min-height:136px;
    border:1px solid var(--line);
    border-radius:15px;
    background:#fff;
    padding:10px;
    text-align:left;
  }
  .style-card.active { border-color:#111; box-shadow:0 0 0 2px #111 inset; }
  .style-card h3 { margin:0 0 7px; font-size:13px; line-height:1.22; }
  .style-card p { margin:0; color:var(--muted); font-size:11px; line-height:1.35; }
  .thumb { border-radius:11px; overflow:hidden; background:#e8e4dc; }
  .try {
    margin-top:10px;
    display:inline-flex;
    border:0;
    border-radius:999px;
    padding:6px 10px;
    background:#111;
    color:#fff;
    font-size:11px;
    font-weight:850;
  }
  .look-row {
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:8px;
    padding:0 12px;
  }
  .look-card, .feed-card {
    border:1px solid var(--line);
    border-radius:13px;
    overflow:hidden;
    background:#fff;
    text-align:left;
  }
  .look-card .thumb { border-radius:0; aspect-ratio:3/4; }
  .look-card p, .feed-card p { margin:8px; font-size:11px; font-weight:800; line-height:1.25; }
  .look-card span, .feed-card span { display:block; color:var(--muted); font-weight:650; margin-top:3px; }
  .feed-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:0 12px 18px;
  }
  .feed-card .thumb { border-radius:0; aspect-ratio:1/1; }
  .view { display:none; min-height:100%; }
  .view.active { display:block; }

  .chat-body { padding:12px 13px 18px; }
  .bubble {
    max-width:86%;
    border-radius:16px;
    padding:11px 12px;
    font-size:12px;
    line-height:1.55;
    margin:8px 0;
  }
  .bubble.user { margin-left:auto; background:#e8f2ec; }
  .bubble.ai { background:#fff; border:1px solid var(--line); }
  .answer {
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    overflow:hidden;
  }
  .answer-copy { padding:13px; }
  .answer-copy h2 { margin:0 0 8px; font-size:17px; line-height:1.15; }
  .answer-copy p { margin:0 0 10px; color:#444; font-size:12px; line-height:1.62; }
  .tag {
    display:inline-flex;
    border-radius:999px;
    background:#f2f0eb;
    padding:4px 8px;
    font-size:10px;
    font-weight:850;
    color:#555;
    margin:0 4px 4px 0;
  }
  .chat-look {
    margin:0 13px 13px;
    border:1px solid var(--line);
    border-radius:13px;
    overflow:hidden;
    background:#fbfaf8;
    text-align:left;
  }
  .chat-look .thumb { border-radius:0; aspect-ratio:4/3; }
  .chat-look div:last-child { padding:10px; }
  .chat-look b { display:block; font-size:12px; margin-bottom:5px; }
  .chat-look span { display:block; color:var(--muted); font-size:11px; line-height:1.35; }
  .option-list { display:grid; gap:7px; margin-top:10px; }
  .option-list button {
    border:1px solid var(--line);
    border-radius:10px;
    background:#fbfaf8;
    text-align:left;
    padding:9px 10px;
    font-size:11px;
    font-weight:800;
  }
  .composer {
    position:sticky;
    bottom:0;
    display:flex;
    gap:8px;
    padding:10px 12px 12px;
    border-top:1px solid var(--line);
    background:rgba(251,250,248,.94);
    backdrop-filter:blur(12px);
  }
  .composer input {
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 12px;
    outline:0;
    font-size:12px;
  }

  .tryon-hero {
    margin:0 12px 10px;
    aspect-ratio:9/13.5;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#ddd;
  }
  .tryon-meta {
    position:absolute;
    inset:0;
    z-index:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:12px;
    color:#fff;
  }
  .tryon-top { display:flex; justify-content:space-between; font-size:11px; font-weight:850; }
  .buy {
    align-self:flex-end;
    border:0;
    border-radius:999px;
    background:var(--hot);
    color:#fff;
    padding:9px 14px;
    font-size:12px;
    font-weight:900;
  }
  .price-stack {
    position:absolute;
    top:52px;
    right:10px;
    z-index:2;
    display:grid;
    gap:7px;
  }
  .price-chip {
    width:52px;
    border:1px solid rgba(255,255,255,.74);
    border-radius:10px;
    background:rgba(255,255,255,.94);
    color:#111;
    overflow:hidden;
    box-shadow:0 5px 16px rgba(0,0,0,.18);
  }
  .price-chip img { aspect-ratio:1/1; }
  .price-chip b { display:block; padding:3px 4px; font-size:10px; text-align:center; }
  .refine {
    margin:0 12px 14px;
    border:1px solid var(--line);
    border-radius:15px;
    background:#fff;
    overflow:hidden;
  }
  .refine-h {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .tabs {
    display:flex;
    gap:7px;
    padding:10px 12px;
    overflow:auto;
  }
  .tab {
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    color:#555;
    padding:6px 10px;
    font-size:11px;
    font-weight:850;
    white-space:nowrap;
  }
  .tab.active { background:#111; color:#fff; border-color:#111; }
  .product-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    padding:0 12px 12px;
  }
  .product {
    border:1px solid var(--line);
    border-radius:11px;
    overflow:hidden;
    background:#fff;
    text-align:left;
  }
  .product.active { border-color:#111; box-shadow:0 0 0 2px #111 inset; }
  .product .thumb { border-radius:0; aspect-ratio:1/1.12; }
  .product-copy { padding:8px; }
  .product-copy b { display:block; font-size:11px; line-height:1.22; min-height:28px; }
  .product-copy span { display:block; margin-top:4px; color:#888; font-size:10px; }
  .product-copy strong { display:block; margin-top:5px; font-size:12px; }
  .product-copy a {
    display:inline-flex;
    margin-top:7px;
    border-radius:999px;
    background:#111;
    color:#fff;
    padding:5px 8px;
    font-size:10px;
    font-weight:850;
  }
  .story {
    margin:0 12px 18px;
    border:1px solid var(--line);
    border-radius:15px;
    background:#fff;
    overflow:hidden;
  }
  .story .thumb { height:136px; border-radius:0; }
  .story article { padding:12px; }
  .story h2 { margin:0 0 7px; font-size:15px; }
  .story p { margin:0 0 8px; color:#444; font-size:12px; line-height:1.56; }
  .story ol { margin:0; padding-left:18px; color:#555; font-size:12px; line-height:1.58; }

  @media (max-width:560px) {
    .topbar { padding:0 12px; }
    .brand { font-size:18px; }
    .status { display:none; }
    .stage { padding:12px 10px 24px; place-items:start center; }
    .phone { border-width:6px; border-radius:26px; }
    .screen { height:calc(100vh - 92px); min-height:680px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html" aria-label="返回 Demo 入口">‹</a>
  <div class="brand">Fashion Lab</div>
  <div class="status"><i></i><span>AI stylist is ready</span></div>
</header>

<main class="stage">
  <section class="phone" aria-label="Fashion Lab shopping assistant">
    <div class="screen">
      <div class="view active" id="homeView"></div>
      <div class="view" id="chatView"></div>
      <div class="view" id="tryonView"></div>
    </div>
  </section>
</main>

<script>
const imageUrl = (prompt, size = "portrait_4_3") =>
  "https://copilot-cn.bytedance.net/api/ide/v1/text_to_image?prompt=" +
  encodeURIComponent(prompt) + "&image_size=" + size;

const trends = [
  {
    id:"city",
    tab:"City Utility",
    title:"Easy City Casual Look",
    mood:"Cloudy morning, clean layers, light denim",
    ask:"Inspirations for today's outfit",
    answer:"Cloudy in Beijing today, with cool mornings and a warmer midday. A crisp white tee, relaxed overshirt and light-wash straight jeans keep things fresh and easy, while white sneakers make the look clean enough for work and casual enough for coffee hours.",
    hero:"realistic street style editorial photo, young woman wearing beige trench coat, black tank top, light wash straight leg jeans, white sneakers, new york city street, full body fashion ecommerce lookbook, natural daylight",
    card:"realistic fashion app card, young woman in beige trench coat and blue jeans, full body, clean street style, ecommerce lookbook",
    flatlay:"realistic flat lay outfit, beige trench coat, white tee, light blue straight jeans, white sneakers, small leather bag, clean ecommerce editorial",
    article:"这套 look 抓住近期 city utility 的核心：实穿廓形、干净浅色、可叠穿外套。它适合早晚温差明显的通勤日，也能自然切换到下班后的轻社交场景。",
    reasons:["长外套建立利落轮廓，解决基础内搭过于单薄的问题。","直筒牛仔裤拉长比例，让通勤造型更轻松。","白色球鞋降低正式感，整体更适合日常高频穿着。"],
    products:{
      Coat:[
        ["Double Weave Trench","No. 3N1 Ivory Beige","$32.20","tailored beige double breasted trench coat product photo on clean white background, realistic ecommerce"],
        ["Short Utility Mac","Warm stone","$28.50","short beige utility mac jacket product photo on clean white background, realistic ecommerce"]
      ],
      Top:[
        ["Ribbed Scoop Tank","Soft black","$16.00","black ribbed scoop neck tank top product photo on white background, realistic ecommerce"],
        ["Crisp Cotton Tee","Optic white","$12.00","white cotton crew neck t shirt product photo on white background, realistic ecommerce"]
      ],
      Pants:[
        ["High-rise Straight Jeans","Light vintage blue","$35.90","light wash high rise straight leg jeans product photo on white background, realistic ecommerce"],
        ["Relaxed Tailored Trouser","Warm grey","$31.60","warm grey relaxed tailored trousers product photo on white background, realistic ecommerce"]
      ],
      Shoes:[
        ["Minimal Court Sneaker","White leather","$29.00","minimal white leather sneaker product photo on white background, realistic ecommerce"],
        ["Slim Loafer","Black polished","$34.00","black slim leather loafer product photo on white background, realistic ecommerce"]
      ]
    }
  },
  {
    id:"soft",
    tab:"Soft Minimal",
    title:"Intellectual Design-led Style",
    mood:"Cream knit, fluid skirt, soft weekend texture",
    ask:"Make it softer",
    answer:"For a slower weekend, pair a creamy knit vest with a fluid skirt and suede flats. The silhouette stays polished, but the texture makes it warmer and less formal.",
    hero:"realistic fashion lookbook photo, young woman wearing cream knit vest, white midi skirt, suede ballet flats, minimal cafe street, soft spring daylight, full body",
    card:"realistic fashion ecommerce card, woman in cream knit vest and white midi skirt, warm minimal street style, full body",
    flatlay:"realistic flat lay outfit, cream knit vest, white midi skirt, suede ballet flats, small woven bag, soft daylight, ecommerce editorial",
    article:"Soft minimal 的重点不是全白，而是通过针织、麂皮和奶油色制造柔和质感。它适合周末、咖啡约会和轻度出游。",
    reasons:["针织背心替代普通衬衫，直接提升触感与层次。","白色半裙保留清爽感，同时比长裤更有季节变化。","麂皮鞋让颜色过渡更自然，避免全身过白。"],
    products:{
      Coat:[
        ["Light Cardigan Jacket","Oat milk","$26.80","oatmeal light cardigan jacket product photo, ecommerce white background, realistic knit texture"],
        ["Soft Linen Blazer","Ivory","$39.00","ivory linen blazer product photo on white background, realistic ecommerce"]
      ],
      Top:[
        ["Cream Knit Vest","Vanilla cream","$22.40","cream knit vest product photo on white background, realistic ecommerce"],
        ["Fine Rib Long Sleeve","Warm white","$18.00","warm white fine rib long sleeve top product photo, white background, realistic ecommerce"]
      ],
      Pants:[
        ["Fluid Midi Skirt","Chalk white","$30.20","chalk white fluid midi skirt product photo on white background, realistic ecommerce"],
        ["Soft Wide-leg Pants","Pale taupe","$33.10","pale taupe soft wide leg pants product photo on white background, realistic ecommerce"]
      ],
      Shoes:[
        ["Suede Ballet Flat","Taupe","$24.90","taupe suede ballet flats product photo on white background, realistic ecommerce"],
        ["Low Slingback","Ivory","$31.00","ivory low heel slingback shoes product photo, white background, realistic ecommerce"]
      ]
    }
  },
  {
    id:"night",
    tab:"After-dark Denim",
    title:"Calm High-end Career Style",
    mood:"Leather jacket, dark denim, polished hardware",
    ask:"Make it office-friendly",
    answer:"A cropped leather jacket and clean denim create a sharper after-work outfit. Keep the inner layer simple and let hardware details add the current polished edge.",
    hero:"realistic editorial street style photo, young woman in black cropped leather jacket, white fitted top, dark straight jeans, silver belt, downtown evening, full body fashion lookbook",
    card:"realistic fashion ecommerce card, young woman wearing black cropped leather jacket and dark jeans, calm high end career style, full body",
    flatlay:"realistic flat lay outfit, black leather jacket, white fitted top, dark straight jeans, silver belt, black ankle boots, ecommerce editorial",
    article:"Denim look 近期更强调利落剪裁和配饰细节。短皮衣负责态度，直筒牛仔负责日常可穿性，适合从会议后直接进入晚间场景。",
    reasons:["短夹克抬高腰线，让厚重皮革不显压身。","白色内搭给黑色皮衣留出呼吸感。","银色腰带与小包形成视觉锚点，增加造型完成度。"],
    products:{
      Coat:[
        ["Cropped Leather Jacket","Black","$48.00","black cropped leather jacket product photo, ecommerce white background, realistic"],
        ["Boxy Twill Jacket","Charcoal","$36.50","charcoal boxy twill jacket product photo on white background, realistic ecommerce"]
      ],
      Top:[
        ["Fitted Baby Tee","Clean white","$15.50","white fitted baby tee product photo on white background, realistic ecommerce"],
        ["Square-neck Tank","Black","$16.00","black square neck tank product photo on white background, realistic ecommerce"]
      ],
      Pants:[
        ["Dark Straight Jeans","Washed black","$38.80","washed black straight leg jeans product photo on white background, realistic ecommerce"],
        ["Pinstripe Suit Pants","Deep navy","$42.00","deep navy pinstripe suit pants product photo on white background, realistic ecommerce"]
      ],
      Shoes:[
        ["Pointed Ankle Boot","Black","$46.00","black pointed ankle boots product photo on white background, realistic ecommerce"],
        ["Metallic Mary Jane","Silver","$33.20","silver metallic mary jane shoes product photo, white background, realistic ecommerce"]
      ]
    }
  }
];

let activeTrend = trends[0];
let activeCat = "Coat";
let activeProduct = 0;

const $ = (id) => document.getElementById(id);

function phoneHead({ back = false, right = "Ask AI" } = {}) {
  return `
    <div class="phone-head">
      <span class="time">8:00</span>
      ${back ? `<button class="nav-btn" data-action="home" aria-label="Back">‹</button>` : ""}
      <span class="title">Fashion Lab</span>
      <button class="icon-text" data-action="chat">${right}</button>
    </div>
  `;
}

function img(prompt, size, alt) {
  return `<img src="${imageUrl(prompt, size)}" alt="${alt}">`;
}

function renderHome() {
  $("homeView").innerHTML = `
    ${phoneHead({ right:"Ask AI" })}
    <div class="hero">
      ${img("realistic mobile fashion app hero image, stylish young woman wearing black sunglasses and black leather jacket, clean editorial fashion, soft daylight, ecommerce app", "portrait_4_3", "Fashion daily look")}
      <div class="hero-copy">
        <h1>Hi Jenny,<br>OOTD</h1>
        <p>Get your daily look</p>
      </div>
    </div>
    <form class="ask" data-action="chat">
      <input value="Ask your AI stylist anything" aria-label="Ask your AI stylist anything">
      <button class="round" type="submit" aria-label="Ask">↗</button>
    </form>
    <div class="quick-row">
      <button class="quick" data-action="chat" data-query="Style an item">Style an item<span>Build full outfits</span></button>
      <button class="quick" data-action="chat" data-query="What suits me">What suits me<span>Saved fit stats</span></button>
    </div>
    <div class="section-title">You may wanna try-on</div>
    <div class="style-stack">
      ${trends.map(t => `
        <button class="style-card ${t.id === activeTrend.id ? "active" : ""}" data-action="tryon" data-trend="${t.id}">
          <div>
            <h3>${t.title}</h3>
            <p>${t.mood}</p>
            <span class="try">Try-on look</span>
          </div>
          <div class="thumb">${img(t.card, "portrait_4_3", t.title)}</div>
        </button>
      `).join("")}
    </div>
    <div class="section-title">Intellectual Design-led Style</div>
    <div class="look-row">
      <button class="look-card" data-action="tryon" data-trend="soft">
        <div class="thumb">${img(trends[1].hero, "portrait_4_3", trends[1].title)}</div>
        <p>Cool Aesthetic<span>Avant-garde woman</span></p>
      </button>
      <button class="look-card" data-action="chat" data-trend="soft">
        <div class="thumb">${img(trends[1].flatlay, "portrait_4_3", "Soft minimal outfit")}</div>
        <p>Cool AI<span>Style this item</span></p>
      </button>
    </div>
    <div class="section-title">Explore more style</div>
    <div class="feed-grid">
      ${trends.concat(trends).slice(0,6).map((t, idx) => `
        <button class="feed-card" data-action="${idx % 2 ? "tryon" : "chat"}" data-trend="${t.id}">
          <div class="thumb">${img(idx % 2 ? t.products.Coat[0][3] : t.card, "square", t.tab)}</div>
          <p>${t.tab}<span>${idx % 2 ? t.products.Coat[0][2] : "Try-on style"}</span></p>
        </button>
      `).join("")}
    </div>
  `;
}

function renderChat() {
  $("chatView").innerHTML = `
    ${phoneHead({ back:true, right:"Close" })}
    <div class="chat-body">
      <div class="bubble user">${activeTrend.ask}</div>
      <div class="bubble ai">Based on your local weather, saved fit stats, and current trend signals, here is the best direction.</div>
      <div class="answer">
        <div class="answer-copy">
          <h2>${activeTrend.title}</h2>
          <p>${activeTrend.answer}</p>
          <span class="tag">${activeTrend.tab}</span>
          <span class="tag">Daily styling</span>
          <span class="tag">Shoppable look</span>
          <div class="option-list">
            <button data-action="chat" data-trend="soft">Make it softer</button>
            <button data-action="chat" data-trend="city">Add more layers</button>
            <button data-action="chat" data-trend="night">Make it office-friendly</button>
          </div>
        </div>
        <button class="chat-look" data-action="tryon" data-trend="${activeTrend.id}">
          <div class="thumb">${img(activeTrend.flatlay, "landscape_4_3", activeTrend.title)}</div>
          <div>
            <b>Try it on</b>
            <span>Open this look and rebuild it with exact products.</span>
          </div>
        </button>
      </div>
    </div>
    <div class="composer">
      <input id="chatInput" value="Tell me what to change..." aria-label="Tell me what to change">
      <button class="round" data-action="smart-chat" aria-label="Send">↗</button>
    </div>
  `;
}

function renderTryon() {
  const cats = Object.keys(activeTrend.products);
  const products = activeTrend.products[activeCat] || activeTrend.products.Coat;
  const selected = products[activeProduct] || products[0];
  $("tryonView").innerHTML = `
    ${phoneHead({ back:true, right:"Ask AI" })}
    <div class="tryon-hero">
      ${img(activeTrend.hero, "portrait_4_3", activeTrend.title)}
      <div class="tryon-meta">
        <div class="tryon-top"><span>Fashion Lab</span><span>Ask AI</span></div>
        <button class="buy" type="button">Buy all</button>
      </div>
      <div class="price-stack">
        ${cats.slice(0,4).map(cat => {
          const p = activeTrend.products[cat][0];
          return `<div class="price-chip">${img(p[3], "square", p[0])}<b>${p[2]}</b></div>`;
        }).join("")}
      </div>
    </div>
    <div class="refine">
      <div class="refine-h"><b>Refine this look</b><span>More look</span></div>
      <div class="tabs">
        ${cats.map(cat => `<button class="tab ${cat === activeCat ? "active" : ""}" data-action="cat" data-cat="${cat}">${cat}</button>`).join("")}
      </div>
      <div class="product-grid">
        ${products.map((p, idx) => `
          <div class="product ${idx === activeProduct ? "active" : ""}" data-action="product" data-product="${idx}" role="button" tabindex="0">
            <div class="thumb">${img(p[3], "square", p[0])}</div>
            <div class="product-copy">
              <b>${p[0]}</b>
              <span>${p[1]}</span>
              <strong>${p[2]}</strong>
              <a href="https://www.tiktok.com/shop" target="_blank" rel="noreferrer">View item</a>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="story">
      <div class="thumb">${img("realistic outfit editorial detail shot featuring " + selected[3] + ", styled with matching clothes, clean ecommerce magazine layout", "landscape_4_3", selected[0])}</div>
      <article>
        <h2>${selected[0]} 搭配讲解</h2>
        <p>${activeTrend.article}</p>
        <ol>${activeTrend.reasons.map(r => `<li>${r}</li>`).join("")}</ol>
      </article>
    </div>
  `;
}

function show(view) {
  document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
  $(view + "View").classList.add("active");
  document.querySelector(".screen").scrollTop = 0;
}

function setTrend(id) {
  activeTrend = trends.find(t => t.id === id) || activeTrend;
  activeCat = "Coat";
  activeProduct = 0;
}

function renderAll() {
  renderHome();
  renderChat();
  renderTryon();
}

document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;
  if (target.dataset.trend) setTrend(target.dataset.trend);
  if (action === "home") { renderAll(); show("home"); return; }
  if (action === "chat") { renderAll(); show("chat"); return; }
  if (action === "tryon") { renderAll(); show("tryon"); return; }
  if (action === "cat") {
    activeCat = target.dataset.cat;
    activeProduct = 0;
    renderTryon();
    show("tryon");
    return;
  }
  if (action === "product") {
    if (e.target.tagName === "A") return;
    activeProduct = Number(target.dataset.product) || 0;
    renderTryon();
    show("tryon");
    return;
  }
  if (action === "smart-chat") {
    const text = ($("chatInput")?.value || "").toLowerCase();
    if (text.includes("soft") || text.includes("柔") || text.includes("约会")) setTrend("soft");
    else if (text.includes("office") || text.includes("皮") || text.includes("酷")) setTrend("night");
    else setTrend("city");
    renderAll();
    show("chat");
  }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  renderAll();
  show("chat");
});

renderAll();
</script>
</body>
</html>
