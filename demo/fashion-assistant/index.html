<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fashion Lab · AI 导购助手 Demo</title>
<style>
  :root {
    --ink:#171717;
    --muted:#767676;
    --line:#e7e2da;
    --paper:#faf8f4;
    --card:#ffffff;
    --soft:#f1eadf;
    --accent:#111111;
    --hot:#ff3f7f;
    --green:#377b56;
    --blue:#eaf2ff;
    --shadow:0 24px 70px rgba(24,20,16,.16);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Microsoft YaHei",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family:var(--font);
    color:var(--ink);
    background:#f5f5f5;
    -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; text-decoration:none; }
  button, input { font:inherit; }
  button { cursor:pointer; color:inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline:2px solid #3b6d57;
    outline-offset:3px;
  }
  img { display:block; width:100%; height:100%; object-fit:cover; }
  .stage {
    min-height:100dvh;
    display:grid;
    place-items:start center;
    padding:24px 0;
  }
  .phone {
    width:min(390px, 100%);
    background:#fff;
    box-shadow:0 8px 36px #0000000b;
    overflow:hidden;
  }
  .screen {
    height:min(844px, calc(100dvh - 48px));
    overflow-y:auto;
    overflow-x:hidden;
    background:#fff;
    scrollbar-width:none;
    overscroll-behavior-y:contain;
  }
  .screen::-webkit-scrollbar { width:0; height:0; }
  .phone-head {
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    font-size:13px;
    font-weight:700;
    background:#ffffffed;
    position:sticky;
    top:0;
    z-index:5;
  }
  .phone-head .title { position:absolute; left:0; right:0; text-align:center; pointer-events:none; }
  .nav-btn {
    width:36px;
    height:36px;
    border:0;
    background:transparent;
    border-radius:50%;
    font-size:25px;
    display:grid;
    place-items:center;
    z-index:1;
  }
  .icon-text { border:0; background:transparent; font-size:11px; font-weight:700; z-index:1; }
  .tryon-hero::after {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.52));
  }
  .round {
    width:28px;
    height:28px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-weight:950;
    display:grid;
    place-items:center;
  }
  .thumb { border-radius:11px; overflow:hidden; background:#e8e4dc; }
  .view { display:none; min-height:100%; }
  .view.active { display:block; }

  .chat-body { padding:12px 13px 18px; }
  .bubble {
    max-width:86%;
    border-radius:16px;
    padding:11px 12px;
    font-size:12px;
    line-height:1.55;
    margin:8px 0;
  }
  .bubble.user { margin-left:auto; background:#e8f2ec; }
  .bubble.ai { background:#fff; border:1px solid var(--line); }
  .answer {
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    overflow:hidden;
  }
  .answer-copy { padding:13px; }
  .answer-copy h2 { margin:0 0 8px; font-size:17px; line-height:1.15; }
  .answer-copy p { margin:0 0 10px; color:#444; font-size:12px; line-height:1.62; }
  .tag {
    display:inline-flex;
    border-radius:999px;
    background:#f2f0eb;
    padding:4px 8px;
    font-size:10px;
    font-weight:850;
    color:#555;
    margin:0 4px 4px 0;
  }
  .chat-look {
    margin:0 13px 13px;
    border:1px solid var(--line);
    border-radius:13px;
    overflow:hidden;
    background:#fbfaf8;
    text-align:left;
  }
  .chat-look .thumb { border-radius:0; aspect-ratio:4/3; }
  .chat-look div:last-child { padding:10px; }
  .chat-look b { display:block; font-size:12px; margin-bottom:5px; }
  .chat-look span { display:block; color:var(--muted); font-size:11px; line-height:1.35; }
  .option-list { display:grid; gap:7px; margin-top:10px; }
  .option-list button {
    border:1px solid var(--line);
    border-radius:10px;
    background:#fbfaf8;
    text-align:left;
    padding:9px 10px;
    font-size:11px;
    font-weight:800;
  }
  .composer {
    position:sticky;
    bottom:0;
    display:flex;
    gap:8px;
    padding:10px 12px 12px;
    border-top:1px solid var(--line);
    background:rgba(251,250,248,.94);
    backdrop-filter:blur(12px);
  }
  .composer input {
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 12px;
    outline:0;
    font-size:12px;
  }

  .tryon-hero {
    margin:0 12px 10px;
    aspect-ratio:9/13.5;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#ddd;
  }
  .tryon-meta {
    position:absolute;
    inset:0;
    z-index:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:12px;
    color:#fff;
  }
  .tryon-top { display:flex; justify-content:space-between; font-size:11px; font-weight:850; }
  .buy {
    align-self:flex-end;
    border:0;
    border-radius:999px;
    background:var(--hot);
    color:#fff;
    padding:9px 14px;
    font-size:12px;
    font-weight:900;
  }
  .price-stack {
    position:absolute;
    top:52px;
    right:10px;
    z-index:2;
    display:grid;
    gap:7px;
  }
  .price-chip {
    width:52px;
    border:1px solid rgba(255,255,255,.74);
    border-radius:10px;
    background:rgba(255,255,255,.94);
    color:#111;
    overflow:hidden;
    box-shadow:0 5px 16px rgba(0,0,0,.18);
  }
  .price-chip img { aspect-ratio:1/1; }
  .price-chip b { display:block; padding:3px 4px; font-size:10px; text-align:center; }
  .refine {
    margin:0 12px 14px;
    border:1px solid var(--line);
    border-radius:15px;
    background:#fff;
    overflow:hidden;
  }
  .refine-h {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .tabs {
    display:flex;
    gap:7px;
    padding:10px 12px;
    overflow:auto;
  }
  .tab {
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    color:#555;
    padding:6px 10px;
    font-size:11px;
    font-weight:850;
    white-space:nowrap;
  }
  .tab.active { background:#111; color:#fff; border-color:#111; }
  .product-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    padding:0 12px 12px;
  }
  .product {
    border:1px solid var(--line);
    border-radius:11px;
    overflow:hidden;
    background:#fff;
    text-align:left;
  }
  .product.active { border-color:#111; box-shadow:0 0 0 2px #111 inset; }
  .product .thumb { border-radius:0; aspect-ratio:1/1.12; }
  .product-copy { padding:8px; }
  .product-copy b { display:block; font-size:11px; line-height:1.22; min-height:28px; }
  .product-copy span { display:block; margin-top:4px; color:#888; font-size:10px; }
  .product-copy strong { display:block; margin-top:5px; font-size:12px; }
  .product-copy a {
    display:inline-flex;
    margin-top:7px;
    border-radius:999px;
    background:#111;
    color:#fff;
    padding:5px 8px;
    font-size:10px;
    font-weight:850;
  }
  .story {
    margin:0 12px 18px;
    border:1px solid var(--line);
    border-radius:15px;
    background:#fff;
    overflow:hidden;
  }
  .story .thumb { height:136px; border-radius:0; }
  .story article { padding:12px; }
  .story h2 { margin:0 0 7px; font-size:15px; }
  .story p { margin:0 0 8px; color:#444; font-size:12px; line-height:1.56; }
  .story ol { margin:0; padding-left:18px; color:#555; font-size:12px; line-height:1.58; }

  @media (max-width:430px) {
    .stage { padding:0; }
    .phone { width:100%; box-shadow:none; }
    .screen { height:100dvh; }
  }
</style>

const byId = (id) => trends.find(t => t.id === id);

  arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',

};
const icon = (name) => `<svg class="ui-icon ${name}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;

function phoneHead({ back = false, right = "Ask AI" } = {}) {
  return `
    <div class="phone-head">
      ${back ? `<button class="nav-btn" data-action="back" aria-label="Back">‹</button>` : ""}
      <span class="title">Fashion Lab</span>
      <button class="icon-text" data-action="${right === "Close" ? "back" : "chat"}">${right}</button>
    </div>
  `;
}

function img(prompt, size, alt, loading = "lazy") {
  return `<img src="${imageUrl(prompt, size)}" alt="${escapeHTML(alt)}" loading="${loading}" decoding="async">`;
}

function garmentStrip(t, categories = ["Coat", "Pants", "Shoes"]) {
  return categories.map(cat => `<span>${img(t.products[cat][0][3], "square", t.products[cat][0][0])}</span>`).join("");
}

function feedProduct(id, cat, index = 0, tall = false) {
  const p = byId(id).products[cat][index];
  const action = `data-action="shop-item" data-trend="${id}" data-cat="${cat}" data-product="${index}"`;
  return `<article class="feed-product ${tall ? "tall" : ""}">
    <button class="feed-product-photo" ${action} aria-label="Try on ${escapeHTML(p[0])}">${img(p[3], "square", p[0])}</button>
    <div class="feed-product-copy"><b>${p[0]}</b><small>${p[1]}</small><strong>${p[2]}</strong></div>
    <button class="soft-cta" ${action}>Try it on</button>
  </article>`;
}

function feedLook(id) {
  const t = byId(id);
  return `<button class="feed-look" data-action="tryon" data-trend="${id}" aria-label="Try on ${escapeHTML(t.title)}">
    ${img(t.hero, "portrait_4_3", t.title)}
    <span class="feed-items">${garmentStrip(t, ["Coat", "Top", "Pants", "Shoes"])}</span>
    <span class="soft-cta">Try-on style</span>
  </button>`;
}

    <div class="home-intro">
      <div class="device-status" aria-hidden="true"><span>8:00</span><span>${icon("signal")}${icon("wifi")}${icon("battery")}</span></div>
      <nav class="home-nav" aria-label="Fashion Lab"><a href="../index.html" aria-label="返回 Demo 入口">${icon("back")}</a><strong>Fashion Lab</strong></nav>
      <div class="ootd">
        <div class="ootd-portrait">${img("editorial studio portrait photograph of a fashionable young adult woman wearing a black baseball cap and narrow black sunglasses, oversized black and cream varsity leather jacket open over a black cropped top, framed from head to hip, facing forward, isolated on a pure white background, high key studio lighting, realistic skin and leather texture, no shadows on background, no text, no phone, no interface", "portrait_4_3", "Black cap and two-tone jacket daily look", "eager")}</div>
        <div class="ootd-copy"><h1>Hi Jenny,<br>OOTD</h1><p>Get your daily look</p><button data-action="chat" data-query="Inspirations for today's outfit" aria-label="Get your daily look">${icon("arrow")}</button></div>
      </div>
      <form class="home-ask" id="homeAsk">
        <input id="homeQuery" placeholder="Ask your AI stylist anything" aria-label="Ask your AI stylist anything" autocomplete="off">
        <button type="submit" aria-label="Ask AI">${icon("mic")}</button>
      </form>
      <div class="home-shortcuts" aria-label="Styling shortcuts">
        <button class="shortcut" data-action="chat" data-trend="night" data-query="How can I style a black leather jacket?">${icon("item")}<span><b>Style an item</b><small>Build full outfits</small></span></button>
        <button class="shortcut" data-action="chat" data-query="Help me find a look that suits me">${icon("fit")}<span><b>What suits me</b><small>Find my style</small></span></button>
        <button class="shortcut icon-only" data-action="chat" data-query="Surprise me with a new look" aria-label="Discover a new look">${icon("sparkle")}</button>
      </div>
    </div>
    <section class="home-section" aria-labelledby="featuredHeading">
      <h2 id="featuredHeading">You may wanna try-on</h2>
      <div class="featured-look">
        <div class="feature-item">
          <h3>Calm, High-End<br>Career Style</h3>
          <button class="feature-garment" data-action="shop-item" data-trend="night" data-cat="Coat" aria-label="Style the leather jacket">${img(night.products.Coat[0][3], "square", "Black leather jacket", "eager")}</button>
          <button class="soft-cta" data-action="tryon" data-trend="night">Try-on look</button>
        </div>
        <button class="feature-model" data-action="tryon" data-trend="night" aria-label="Try on Calm High-End Career Style">${img(night.card, "portrait_4_3", "Leather jacket styled with a white top and dark denim", "eager")}</button>
      </div>
    </section>
    <section class="home-section" aria-labelledby="styleHeading">
      <h3 id="styleHeading">Intellectual Design-Led Style</h3>
      <div class="swipe-shelf" id="styleShelf" role="region" aria-label="Browse styles" tabindex="0">
        ${styles.map(s => {
          const t = byId(s.id);
          return `<button class="style-tile" data-action="chat" data-trend="${s.id}" data-query="Show me how to wear ${s.name}">
            <div class="style-collage"><div class="style-model">${img(t.card || t.hero, "portrait_4_3", s.name)}</div><div class="garment-strip">${garmentStrip(t)}</div></div>
            <div class="style-caption"><span><b>${s.name}</b><small>${s.subtitle}</small></span>${icon("arrow")}</div>
          </button>`;
        }).join("")}
      </div>
    </section>
    <section class="home-section" aria-labelledby="lookHeading">
      <h3 id="lookHeading">Intellectual Design-Led Style</h3>
      <div class="swipe-shelf" id="lookShelf" role="region" aria-label="Browse shoppable looks" tabindex="0">
        ${["tailored", "night", "city"].map(id => {
          const t = byId(id);
          return `<button class="look-tile" data-action="tryon" data-trend="${id}" aria-label="Try on ${t.tab}">
            ${img(t.hero, "portrait_4_3", t.title)}
            <span class="look-items garment-strip">${garmentStrip(t)}</span><span class="soft-cta">Try-on look</span>
          </button>`;
        }).join("")}
      </div>
    </section>
    <section class="home-section" aria-labelledby="exploreHeading">
      <h2 id="exploreHeading">Explore more style</h2>
      <div class="feed-columns">
        <div class="feed-column">${feedLook("city")}${feedProduct("tailored", "Top", 1)}${feedProduct("tailored", "Pants", 1, true)}${feedLook("night")}</div>
        <div class="feed-column">${feedProduct("city", "Coat")}${feedLook("soft")}${feedProduct("city", "Top", 0, true)}${feedProduct("soft", "Shoes")}</div>
      </div>
    </section>
    <p class="home-end">A little inspiration, a look that's you.</p>
  `;
}

function renderChat() {
  $("chatView").innerHTML = `
    ${phoneHead({ back:true, right:"Close" })}
    <div class="chat-body">
      <div class="bubble user">${escapeHTML(chatQuery || activeTrend.ask)}</div>
      <div class="bubble ai">Let's build your look around ${escapeHTML(activeTrend.tab.toLowerCase())}. Explore the pieces below, or tell me what you would change.</div>
      <div class="answer">
        <div class="answer-copy">
          <h2>${activeTrend.title}</h2>
          <p>${activeTrend.answer}</p>
          <span class="tag">${activeTrend.tab}</span>
          <span class="tag">Daily styling</span>
          <span class="tag">Shoppable look</span>
          <div class="option-list">
            <button data-action="chat" data-trend="soft">Make it softer</button>
            <button data-action="chat" data-trend="city">Add more layers</button>
            <button data-action="chat" data-trend="night">Make it office-friendly</button>
          </div>
        </div>
        <button class="chat-look" data-action="tryon" data-trend="${activeTrend.id}">
          <div class="thumb">${img(activeTrend.flatlay, "landscape_4_3", activeTrend.title)}</div>
          <div>
            <b>Try it on</b>
            <span>Open this look and rebuild it with exact products.</span>
          </div>
        </button>
      </div>
    </div>
    <form class="composer" id="chatForm">
      <input id="chatInput" placeholder="Tell me what to change..." aria-label="Tell me what to change" autocomplete="off">
      <button class="round" type="submit" aria-label="Send">↗</button>
    </form>
  `;
}

function renderTryon() {
  const cats = Object.keys(activeTrend.products);
  const products = activeTrend.products[activeCat] || activeTrend.products.Coat;
  const selected = products[activeProduct] || products[0];
  $("tryonView").innerHTML = `
    ${phoneHead({ back:true, right:"Ask AI" })}
    <div class="tryon-hero">
      ${img(activeTrend.hero, "portrait_4_3", activeTrend.title)}
      <div class="tryon-meta">
        <div class="tryon-top"><span>Fashion Lab</span><span>Ask AI</span></div>
        <button class="buy" type="button">Buy all</button>
      </div>
      <div class="price-stack">
        ${cats.slice(0,4).map(cat => {
          const p = activeTrend.products[cat][chosenProducts[cat]];
          return `<div class="price-chip">${img(p[3], "square", p[0])}<b>${p[2]}</b></div>`;
        }).join("")}
      </div>
    </div>
    <div class="refine">
      <div class="refine-h"><b>Refine this look</b><span>More look</span></div>
      <div class="tabs">
        ${cats.map(cat => `<button class="tab ${cat === activeCat ? "active" : ""}" data-action="cat" data-cat="${cat}">${cat}</button>`).join("")}
      </div>
      <div class="product-grid">
        ${products.map((p, idx) => `
          <div class="product ${idx === activeProduct ? "active" : ""}" data-action="product" data-product="${idx}" role="button" tabindex="0" aria-pressed="${idx === activeProduct}">
            <div class="thumb">${img(p[3], "square", p[0])}</div>
            <div class="product-copy">
              <b>${p[0]}</b>
              <span>${p[1]}</span>
              <strong>${p[2]}</strong>
              <a href="https://www.tiktok.com/shop" target="_blank" rel="noreferrer">View item</a>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="story">
      <div class="thumb">${img("realistic outfit editorial detail shot featuring " + selected[3] + ", styled with matching clothes, clean ecommerce magazine layout", "landscape_4_3", selected[0])}</div>
      <article>
        <h2>${selected[0]} 搭配讲解</h2>
        <p>${activeTrend.article}</p>
        <ol>${activeTrend.reasons.map(r => `<li>${r}</li>`).join("")}</ol>
      </article>
    </div>
  `;
}

function show(view, { back = false } = {}) {
  const screen = document.querySelector(".screen");
  if (view !== currentView) {
    scrollPositions[currentView] = screen.scrollTop;
    if (!back) navigation.push(currentView);
  }
  document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
  $(view + "View").classList.add("active");
  currentView = view;
  screen.scrollTop = back ? scrollPositions[view] : 0;
}

function goBack() {
  show(navigation.pop() || "home", { back:true });
}

function setTrend(id) {
  activeTrend = trends.find(t => t.id === id) || activeTrend;
  activeCat = "Coat";
  activeProduct = 0;
  Object.keys(chosenProducts).forEach(cat => chosenProducts[cat] = 0);
}

function askStylist(query) {
  chatQuery = query.trim() || activeTrend.ask;
  const text = chatQuery.toLowerCase();
  if (/soft|柔|周末|约会|cream/.test(text)) setTrend("soft");
  else if (/suit|tailor|西装/.test(text)) setTrend("tailored");
  else if (/leather|皮|酷|office/.test(text)) setTrend("night");
  else if (/layer|denim|牛仔|通勤|daily|outfit/.test(text)) setTrend("city");
  renderChat();
  show("chat");
}

function refreshProducts() {
  const screen = document.querySelector(".screen");
  const top = screen.scrollTop;
  renderTryon();
  screen.scrollTop = top;
}

document.addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;
  if (action === "back") { goBack(); return; }
  if (target.dataset.trend && currentView === "home") setTrend(target.dataset.trend);
  if (action === "chat") {
    if (target.dataset.trend) setTrend(target.dataset.trend);
    chatQuery = target.dataset.query || activeTrend.ask;
    renderChat();
    show("chat");
    return;
  }
  if (action === "tryon" || action === "shop-item") {
    if (action === "shop-item") {
      activeCat = target.dataset.cat;
      activeProduct = Number(target.dataset.product || 0);
      chosenProducts[activeCat] = activeProduct;
    }
    renderTryon();
    show("tryon");
    if (action === "shop-item") {
      const screen = document.querySelector(".screen");
      const refine = document.querySelector("#tryonView .refine");
      screen.scrollTop = refine.getBoundingClientRect().top - screen.getBoundingClientRect().top - 48;
    }
    return;
  }
  if (action === "cat") {
    activeCat = target.dataset.cat;
    activeProduct = chosenProducts[activeCat];
    refreshProducts();
    return;
  }
  if (action === "product") {
    activeProduct = Number(target.dataset.product) || 0;
    chosenProducts[activeCat] = activeProduct;
    refreshProducts();
    return;
  }
});

document.addEventListener("keydown", (e) => {
  const product = e.target.closest('.product[role="button"]');
  if (product && e.target === product && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    product.click();
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "homeAsk" && e.target.id !== "chatForm") return;
  e.preventDefault();
  askStylist(e.target.querySelector("input").value);
});

renderHome();
</script>
</body>
