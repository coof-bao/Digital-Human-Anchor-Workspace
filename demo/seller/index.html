请输出合法 JSON，不要 Markdown，不要解释。最外层必须是对象，不能直接输出数组。

结构：
{"clips":[{"id":"clip_001","type":"strong|bg|risk","title":"简短标题","source_index":{{source_index}},"start_time_sec":0,"duration_sec":15,"duration":"15s","visual_content":"完整视觉内容","asr_content":"完整原始 ASR，无声填空字符串","selling_point":"对应卖点/泛展示/不推荐","layer":"foreground|background|disabled","relevance":0.0,"product_match_score":0.0,"match_reason":"匹配原因"}]}

分类口径：判断这个 Clip 在直播脚本里能承担什么功能。
- strong=强卖点素材：能直接支撑购买理由（功能/效果/价格/配件/优惠/保障/痛点解决/使用结果/对比，或 ASR 直接讲出与卖点匹配的购买理由）。
- bg=泛展示素材：与商品/同品类/同场景相关但非强购买理由，适合背景/转场/铺垫/外观/包装/颜色/手持/氛围/补画面。能帮助理解商品、建立场景、增加真实感的，归 bg。
- risk=不相关/不推荐：素材与当前商品/品类/场景都无法建立关系，或会误导脚本/暴露短板/违反禁讲（完全不同品类、竞品强露出、无法识别、质量差到不可用、主题跑题且画面无关）。

画面层级 layer：
- foreground：本段核心画面、需全屏（强卖点证明、关键演示、价格/套装/开箱重点、必须看清的操作细节）。
- background：铺满背景画布、承担氛围/外观/场景/包装/颜色/弱卖点；泛展示优先 background。
- disabled：只用于 risk。

商品信息：
{{product_info}}

当前视频：
{{video_info}}

要求：
1. 先判断视频整体是否匹配当前商品再切 Clip。
2. Clip 数量按语义自动切分，不限数量，但每个 Clip 控制在 5-15 秒。
3. start_time_sec 与 duration_sec 尽量准确；duration_sec ∈ [5,15]；超 15s 的语义段按镜头/口播停顿/卖点/动作拆多个；短于 5s 与相邻同语义合并。
4. visual_content 与 asr_content 要完整，不摘要、不删减；无声则 asr_content 填空字符串。
5. 不要因为弱卖点/只展示外观或包装/没有 ASR 就标 risk；这些通常是 bg。
6. 仅当 product_match_score < 0.25，或确为完全无关/无法识别/竞品误导/违反禁讲时才 type=risk、layer=disabled、selling_point=不推荐。
7. match_reason 说明为什么是 strong/bg/risk，以及为什么选 foreground/background/disabled。
8. 所有字符串为单行 JSON 字符串，不含未转义换行。`;

const THUMB_PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="270" height="480"><rect fill="#eceff3" width="100%" height="100%"/><text x="50%" y="50%" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="13">无预览</text></svg>');

function isMostlyBlack(ctx, w, h){
  try{
    const img=ctx.getImageData(0, 0, w, h);
    let dark=0, n=0;
    for(let y=0; y<h; y+=10){
      for(let x=0; x<w; x+=10){
        const i=(y*w+x)*4;
        const l=0.299*img.data[i]+0.587*img.data[i+1]+0.114*img.data[i+2];
        if(l<22) dark++;
        n++;
      }
    }
    return n>0 && dark/n>0.78;
  }catch(e){ return false; }
}

function drawVideoFrame(v, rejectBlack){
  try{
    const vw=v.videoWidth, vh=v.videoHeight;
    if(!vw||!vh) return null;
    const c=document.createElement("canvas"); c.width=270; c.height=480;
    const ctx=c.getContext("2d");
    const ar=c.width/c.height, va=vw/vh;
    let sw=vw, sh=vh, sx=0, sy=0;
    if(va>ar){ sw=vh*ar; sx=(vw-sw)/2; } else { sh=vw/ar; sy=(vh-sh)/2; }
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
    if(rejectBlack && isMostlyBlack(ctx, c.width, c.height)) return null;
    return c.toDataURL("image/jpeg", 0.82);
  }catch(e){ return null; }
}

function captureThumbsBatch(objectUrl, times, opts){
  const rejectBlack=!!(opts&&opts.rejectBlack);
  const list=(times||[]).map(t=>Math.max(0, Number(t)||0));
  if(!list.length) return Promise.resolve([]);
  return new Promise((resolve)=>{
    const v=document.createElement("video");
    v.muted=true; v.playsInline=true; v.preload="auto";
    v.src=objectUrl;
    const out=new Array(list.length).fill(null);
    let idx=0, finished=false, started=false;
    const cleanup=()=>{ try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){} };
    const finishAll=()=>{ if(finished) return; finished=true; cleanup(); resolve(out); };
    const seekNext=()=>{
      if(idx>=list.length){ finishAll(); return; }
      const dur=v.duration;
      let target=list[idx];
      if(isFinite(dur)&&dur>0) target=Math.min(target, Math.max(0, dur-0.08));
      const onSeeked=()=>{
        v.removeEventListener("seeked", onSeeked);
        out[idx]=drawVideoFrame(v, rejectBlack);
        idx++;
        seekNext();
      };
      v.addEventListener("seeked", onSeeked);
      try{
        if(Math.abs(v.currentTime-target)<0.02){ onSeeked(); return; }
        v.currentTime=target;
      }catch(e){
        v.removeEventListener("seeked", onSeeked);
        idx++;
        seekNext();
      }
    };
    const begin=()=>{ if(started) return; started=true; seekNext(); };
    v.onloadeddata=begin;
    v.onloadedmetadata=()=>{ if(v.readyState>=2) begin(); };
    v.onerror=()=>finishAll();
    setTimeout(finishAll, 15000 + list.length * 4000);
  });
}

function captureThumb(objectUrl, t, rejectBlack){
  return captureThumbsBatch(objectUrl, [t], { rejectBlack }).then(arr=>arr[0]||null);
}

async function captureBestThumb(objectUrl, durHint){
  const dur=durHint || await readVideoDuration(objectUrl);
  const maxT=Math.max(0.12, (dur||30)-0.08);
  const times=[0.5, 1, 1.5, 2, 0.15, Math.min(3, dur*0.08), Math.min(5, dur*0.12)].filter(t=>t<=maxT);
  const uniq=[...new Set(times.map(t=>Math.round(t*100)/100))];
  const thumbs=await captureThumbsBatch(objectUrl, uniq, { rejectBlack:true });
  const hit=thumbs.find(t=>t);
  if(hit) return hit;
  return captureThumb(objectUrl, Math.min(0.5, maxT), false);
}
function readVideoDuration(objectUrl){
  return new Promise((res)=>{
    const v=document.createElement("video"); v.preload="metadata"; v.muted=true; v.src=objectUrl;
    v.onloadedmetadata=()=>res(Math.max(1, Math.round(v.duration)||30));
    v.onerror=()=>res(30);
    setTimeout(()=>res(30), 6000);
  });
}

async function normalizeParsedClips(parsed, srcIdx, objectUrl, productId){
  const list = Array.isArray(parsed)? parsed : (parsed.clips||[]);
  const pid = productId || curProduct().id;
  const meta=[];
  for(let i=0;i<list.length;i++){
    const c=list[i]||{};
    const ms = Math.round(Math.max(0,Math.min(1, Number(c.product_match_score)||0.5))*100);
    let type = ["strong","bg","risk"].includes(c.type)? c.type : "bg";
    if(ms<25) type="risk";
    const start = Math.max(0, Number(c.start_time_sec)||0);
    const rawDur = Math.max(1, Math.min(120, Number(c.duration_sec)|| (parseInt(c.duration)||8)));
    const dur = type==="risk" ? rawDur : Math.max(30, rawDur);
    const layer = c.layer==="foreground"?"foreground":(c.layer==="background"?"background":(type==="risk"?"none":"background"));
    const reason = c.match_reason || (type==="strong"? D.REASON?.strong : type==="bg"? D.REASON?.bg : D.REASON?.risk) || "";
    meta.push({ c, i, ms, type, start, dur, layer, reason, thumbAt: start + 0.12 });
  }
  const thumbs = await captureThumbsBatch(objectUrl, meta.map(m=>m.thumbAt));
  const out = meta.map((m, ti)=>{
    const { c, i, ms, type, start, dur, layer, reason } = m;
    return {
      clip_index: 900+S.uploadedClips.length+i, clip_id: c.id||("upload_"+String(i+1).padStart(3,"0")),
      product_id: pid, source_index: srcIdx, start, end: start+dur, start_time_sec:start, duration_sec:dur,
      clip_type: type, visual_zh: c.visual_content||c.title||"", visual_content: c.visual_content||c.title||"",
      asr_content: c.asr_content||"（无人声）", selling_point: c.selling_point||(type==="risk"?"不推荐":type==="bg"?"泛展示":"对应卖点"),
      tags: [c.title].filter(Boolean), highlight: ms>=90,
      recommend_use: layer==="foreground"?"foreground":(layer==="background"?"background":"none"),
      match_score: ms, product_match_score:+(ms/100).toFixed(2), relevance:+((Number(c.relevance)||ms/100).toFixed(2)),
      match_reason: reason, visual_layer: layer, asr_lang:null,
      thumbUrl: thumbs[ti] || THUMB_PLACEHOLDER, _uploaded:true,
      clip_source:"local_upload", clip_source_label:"本地上传",
    };
  });
  return out.sort((a,b)=>(b.match_score||0)-(a.match_score||0));
}

function syncScenesFromSellingPoints(){
  const p = curProduct(); ensureLiveInfo(p);
  const sps = p.liveInfo.sellingPoints;
  const bySp = {}; S.scenes.forEach(sc=>{ if(sc.sellingPointId) bySp[sc.sellingPointId]=sc; });
  S.scenes = sps.map((sp, i)=>{
    const ex = bySp[sp.id];
    const title = sp.key || ("未命名卖点 "+(i+1));
    if(ex){
      ex.title = title; ex.spKey = sp.key||""; ex.spValue = sp.value||"";
      if(!ex.overlays || !ex.overlays.length) ex.overlays = defaultSceneOverlays(p);
      return ex;
    }
    return Object.assign(newScene(title, 1, sp.id), { spKey:sp.key||"", spValue:sp.value||"", overlays:defaultSceneOverlays(p) });
  });
  if(S.buildSceneIdx >= S.scenes.length) S.buildSceneIdx = Math.max(0, S.scenes.length-1);
}
function addSellingPoint(p){
  ensureLiveInfo(p);
  p.liveInfo.sellingPoints.push({ id:newSpId(), key:"", value:"" });
}
function removeSellingPoint(p, idx){
  const sp = p.liveInfo.sellingPoints[idx];
  confirmBox("删除这条卖点后，对应的 Scene 也会删除，确定吗？", ()=>{
    p.liveInfo.sellingPoints.splice(idx,1);
    saveLiveInfo(p);
    if(S.scenes.length) syncScenesFromSellingPoints();
    window.__dirty=true; render();
  }, "Delete");
}
function updateSceneSellingPoint(sc, field, val){
  const pr = curProduct(); ensureLiveInfo(pr);
  const sp = pr.liveInfo.sellingPoints.find(s=>s.id===sc.sellingPointId);
  if(!sp) return;
  if(field==="key"){ sp.key=val; sc.spKey=val; sc.title=val||("未命名卖点"); }
  else { sp.value=val; sc.spValue=val; }
  S.buildSpSyncHint = true;
  window.__dirty = true;
}
function refreshSceneNavTitles(){
  document.querySelectorAll(".scene-nav-item .scene-nav-title").forEach((n,i)=>{
    const sc = S.scenes[i]; if(sc) n.textContent = sc.spKey || sc.title || ("Scene "+(i+1));

}

function renderStepbar() {
  const seq = stepSeq(), bar = $("#stepbar"); bar.innerHTML = "";
  seq.forEach((k, i) => {
    const idx = seq.indexOf(S.step);
    const cur = seq.indexOf(k);
    const cls = k === S.step ? "active" : (cur < idx ? "done" : "");
    const node = el("div", "step " + cls, `<span class="num">${cur<idx?"✓":i+1}</span> ${STEP_LABEL[k]}`);
    node.onclick = () => { if (cur <= idx) { S.step = k; render(); } };

    if (i < seq.length-1) bar.appendChild(el("div","sep"));
  });
}

      const note = (body.querySelector("#fbNote")?.value||"").trim();
      S.clipFeedbacks[fbKey] = { reasons, note, ts: Date.now() };
      persistClipFeedbacks();
      fbBtn.textContent = "已反馈 ✓";
      fbBtn.disabled = true;
      body.querySelectorAll("#fbReasons input").forEach(inp=>{ inp.disabled=true; inp.closest(".feedback-chip")?.classList.add("on"); });
      const noteEl = body.querySelector("#fbNote"); if(noteEl) noteEl.disabled = true;
      const ok = body.querySelector(".clip-feedback-section");
      if(ok && !ok.querySelector(".fb-done")){ const d=el("div","muted fb-done"); d.style.cssText="font-size:11.5px;margin-top:6px;color:var(--ready)"; d.textContent="✓ 已收到你的反馈，感谢！仍可继续用到本 Scene。"; ok.appendChild(d); }
    };
  }
}

// opts.asBackground=true 时，选中的视频 clip 作为「方式1 背景视频」回填，而非方式2 主片段
function openSceneLibrary(scene, opts) {
  const asBg = !!(opts && opts.asBackground);
  const pick = (c) => {
    if (asBg) { scene.bgType = "video"; scene.bgClip = c; scene.bg = c.title || c.visual_content?.slice(0,12) || "视频背景"; }

  const pickWhole = (wv, mode) => {
    if(mode==="bg" || asBg){
      scene.bgType = "video";
      scene.bgClip = wholeVideoToBgClip(wv);
      scene.bg = wv.name.replace(/\.(mp4|mov|webm|m4v)$/i,"").slice(0,12) || "视频背景";
    } else {
      scene.clip = wholeVideoToSceneClip(wv, scene);
      scene.method = 2;

  };
  const banks = [D.CLIPS_M1, D.CLIPS_M2, D.CLIPS_LIVE];
  const rebuildAllClips = () => banks.flatMap(b=>b.clips.filter(c=>c.clip_type!=="risk").map(c=>({...c, _bank:b})))
    .concat(S.uploadedClips.filter(c=>c.clip_type!=="risk").map(c=>({...c, clip_source:"local_upload", clip_source_label:"本地上传"})));
  const body = el("div","assets-modal");
  body.innerHTML = `

        <button class="btn ghost sm" data-src="whole">整段视频</button>

    <div id="srcBody"></div>`;
  const dlg = modal(asBg ? "My assets · 选择背景视频" : "My assets · 选择素材", body, null);
  const sb = body.querySelector("#srcBody");
  const parseDock = body.querySelector("#parseProgressDock");
  let parseRunId = 0;
  let parseActiveTimer = null;
  function clearParseTimer(){ if(parseActiveTimer){ clearInterval(parseActiveTimer); parseActiveTimer=null; } }
  function resetParseFileInput(){ const vf=sb.querySelector("#vf"); if(vf) vf.value=""; }
  function showParseProgress(fileName, runId){
    if(!parseDock) return null;

    const setp=(v,label)=>{ if(runId!==parseRunId||!bar) return; bar.style.width=v+"%"; pp.textContent=v+"%"; if(label&&st) st.innerHTML=label; };
    return { setp, bar, pp, st };
  }
  function hideParseProgress(){ clearParseTimer(); if(parseDock){ parseDock.style.display="none"; parseDock.innerHTML=""; } }
  function isParsing(){ return parseActiveTimer !== null; }
  // 卖点上下文：弹框是从「某商品的某 Scene/卖点」点进来的，按 (商品 × 卖点) 给相关度
  const li = ensureLiveInfo(curProduct());
  const ctxText = ((scene && (scene.spKey||scene.title)) || "") + " " + li.sellingPoints.map(s=>s.key).join(" ") + " " + (curProduct().ip || "");
  const ctxKw = ctxText.toLowerCase().split(/[^a-z0-9\u4e00-\u9fa5]+/).filter(w=>w.length>=2);
  const relScore = (c)=>{

    <div class="zh-ref-fold" style="display:none;margin-top:10px">

  box.querySelector(".genScript").onclick = ()=>{ sc._pendingGenOpts = null; runScriptGenerate(box, sc, i, "✨ 正在生成话术…"); };
  bindScriptEditor(box, sc, i);

function overlayThumb(ov){
  if(ov.img) return bg(ov.img);
  if(ov.type==="price"||ov.type==="flash"||ov.type==="announce") return "background:linear-gradient(135deg,#fe2c55,#ff6b6b);";
  if(ov.type==="ship") return "background:linear-gradient(135deg,#0a8a8a,#16a34a);";
  if(ov.type==="sale") return "background:linear-gradient(135deg,#d97706,#f59e0b);";
  return "background:var(--grey-200);";
}
function overlayPreviewLabel(ov){
  if(ov.text) return ov.text.length>12?ov.text.slice(0,11)+"…":ov.text;
  return ov.label;
}
function ensureOvLayout(ov, def){
  if(!ov.layout) ov.layout = { leftPct: def.leftPct||10, topPct: def.topPct||10, widthPct: def.widthPct||30, scale: def.scale||1 };
  return ov.layout;
}
function findOverlayById(id, scope){
  if(scope==="global") return S.globalOverlays.find(o=>o.id===id);
  const sc = S.scenes[S.buildSceneIdx];
  return sc && sc.overlays && sc.overlays.find(o=>o.id===id);
}
function overlayDragHtml(ov, scope, def){
  if(!ov.selected) return "";
  const ly = ensureOvLayout(ov, def);
  const sel = (S.previewSel && S.previewSel.id===ov.id) ? " preview-sel" : "";
  const z = scope==="scene" ? 14 : 12;
  const inner = ov.img
    ? `<div class="op-checker" style="width:100%;line-height:0;border-radius:4px;overflow:hidden"><img src="${encodeURI(ov.img)}" alt="" style="width:100%;display:block;pointer-events:none"></div>`
    : `<span style="font-size:10px;padding:4px 8px;background:rgba(254,44,85,.92);color:#fff;border-radius:6px;display:inline-block">${esc(overlayPreviewLabel(ov))}</span>`;
  return `<div class="dragEl overlay-drag${sel}" data-ov-id="${esc(ov.id)}" data-scope="${scope}" style="position:absolute;left:${ly.leftPct}%;top:${ly.topPct}%;width:${ly.widthPct}%;transform:scale(${ly.scale});transform-origin:top left;cursor:move;touch-action:none;z-index:${z}">${inner}<span class="rzHandle"></span></div>`;
}
function sceneOverlayInheritHint(sc){
  const n = (sc.overlays||[]).filter(o=>o.selected).length;
  return n ? `${n} 个已启用` : "未设置 · 沿用全场";
}

    card.querySelector(".scDel").onclick = ()=>{

  function applyRecommendedLayout(){
    S.layout.avatar = { x:0, y:-12, scale:0.88 };
    const activeSc = S.scenes[S.buildSceneIdx];
    if(activeSc && activeSc.overlays){
      activeSc.overlays.forEach(o=>{
        ensureOvLayout(o, {});
        if(o.type==="product") Object.assign(o.layout, { leftPct:58, topPct:8, widthPct:28, scale:1 });
        if(o.type==="announce") Object.assign(o.layout, { leftPct:50, topPct:40, widthPct:42, scale:1 });
      });
    }
    S.globalOverlays.forEach(o=>{
      ensureOvLayout(o, {});
      if(o.type==="logo") Object.assign(o.layout, { leftPct:6, topPct:6, widthPct:24, scale:1 });
    });
    drawStage(); bindLayout();
  }
  function drawStage(){
    const pv = wrap.querySelector("#pv"); if(!pv) return;
    const activeSc = S.scenes[S.buildSceneIdx];
    const st = stageBg(activeSc);
    const avUrl = S.avatar ? D.avatarImg(S.avatar) : "";
    let ovHtml = "";
    S.globalOverlays.filter(o=>o.selected).forEach((o,idx)=>{
      ovHtml += overlayDragHtml(o, "global", { leftPct:6+idx*2, topPct:6, widthPct:26, scale:1 });
    });
    if(activeSc && activeSc.overlays){
      activeSc.overlays.filter(o=>o.selected).forEach((o,idx)=>{
        ovHtml += overlayDragHtml(o, "scene", { leftPct:52, topPct:12+idx*12, widthPct:34, scale:1 });
      });
    }
    pv.innerHTML = `<div class="livebadge">● LIVE</div>
      <div class="layer" style="${st.style}"></div>
      <div class="dragEl avatar-stage" data-k="avatar" style="position:absolute;left:50%;bottom:0;width:60%;height:80%;transform:${tf(S.layout.avatar)};transform-origin:bottom center;cursor:move;touch-action:none;z-index:10">
        <div class="op-checker avatar-cutout" style="width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:8px">
          ${avUrl?`<img src="${encodeURI(avUrl)}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;object-position:bottom center;mix-blend-mode:multiply;filter:contrast(1.06)">`:""}
        </div>
        <span class="rzHandle" style="position:absolute;right:8%;top:0;width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid #fff;cursor:nwse-resize"></span></div>
      ${ovHtml}
      <div class="caption">点击选中 · 拖动移动 · 拉圆点缩放 · 数字人已去灰底（透明抠图 Demo）</div>`;
    bindStage(pv);
  }
  function bindStage(pv){
    const rect = ()=> pv.getBoundingClientRect();
    pv.querySelectorAll(".dragEl[data-k=avatar]").forEach(elm=>{
      elm.addEventListener("pointerdown", (e)=>{
        if(e.target.classList.contains("rzHandle")) return;
        e.preventDefault(); S.previewSel = { type:"avatar" };
        const sx=e.clientX, sy=e.clientY, ox=S.layout.avatar.x, oy=S.layout.avatar.y;
        const move=(ev)=>{ S.layout.avatar.x=ox+(ev.clientX-sx); S.layout.avatar.y=oy+(ev.clientY-sy); elm.style.transform=tf(S.layout.avatar); bindLayout(); };
        const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); };
        document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
      });
      const h = elm.querySelector(".rzHandle");
      if(h) h.addEventListener("pointerdown",(e)=>{
        e.preventDefault(); e.stopPropagation(); S.previewSel = { type:"avatar" };
        const sy=e.clientY, os=S.layout.avatar.scale;
        const move=(ev)=>{ let s=os+(ev.clientY-sy)*-0.012; s=Math.max(0.4,Math.min(2,s)); S.layout.avatar.scale=s; elm.style.transform=tf(S.layout.avatar); bindLayout(); };
        const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); };
        document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
      });
    });
    pv.querySelectorAll(".dragEl.overlay-drag").forEach(elm=>{
      const ovId = elm.dataset.ovId;
      const scope = elm.dataset.scope;
      const getOv = ()=> findOverlayById(ovId, scope);
      elm.addEventListener("pointerdown", (e)=>{
        if(e.target.classList.contains("rzHandle")){
          e.preventDefault(); e.stopPropagation();
          S.previewSel = { type:"overlay", id:ovId, scope };
          pv.querySelectorAll(".overlay-drag").forEach(x=>x.classList.remove("preview-sel"));
          elm.classList.add("preview-sel");
          const ov = getOv(); if(!ov) return;
          ensureOvLayout(ov, {});
          const sy=e.clientY, os=ov.layout.scale;
          const move=(ev)=>{ let s=os+(ev.clientY-sy)*-0.012; s=Math.max(0.5,Math.min(2.2,s)); ov.layout.scale=s; elm.style.transform=`scale(${s})`; bindLayout(); };
          const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); };
          document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
          return;
        }
        e.preventDefault();
        S.previewSel = { type:"overlay", id:ovId, scope };
        pv.querySelectorAll(".overlay-drag").forEach(x=>x.classList.remove("preview-sel"));
        elm.classList.add("preview-sel");
        const ov = getOv(); if(!ov) return;
        ensureOvLayout(ov, {});
        const r = rect();
        const sx=e.clientX, sy=e.clientY, sl=ov.layout.leftPct, st=ov.layout.topPct;
        const move=(ev)=>{
          ov.layout.leftPct = Math.max(0, Math.min(82, sl + (ev.clientX-sx)/r.width*100));
          ov.layout.topPct = Math.max(0, Math.min(82, st + (ev.clientY-sy)/r.height*100));
          elm.style.left = ov.layout.leftPct + "%";
          elm.style.top = ov.layout.topPct + "%";
          bindLayout();
        };
        const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); };
        document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
      });
    });
  }
  function bindLayout(){
    const P = wrap.querySelector("#layoutPanel"); if(!P) return;
    const activeSc = S.scenes[S.buildSceneIdx];
    let selLabel = "数字人";
    let resetFn = ()=>{ S.layout.avatar={x:0,y:0,scale:1}; drawStage(); bindLayout(); };
    let deleteFn = null;
    if(S.previewSel && S.previewSel.type==="overlay"){
      const ov = findOverlayById(S.previewSel.id, S.previewSel.scope);
      if(ov){
        ensureOvLayout(ov, {});
        selLabel = (S.previewSel.scope==="global"?"全场":"本卖点") + " · " + ov.label;
        resetFn = ()=>{ ov.layout={ leftPct:52, topPct:14, widthPct:34, scale:1 }; drawStage(); bindLayout(); };
        deleteFn = ()=>{
          const list = S.previewSel.scope==="global" ? S.globalOverlays : (activeSc && activeSc.overlays);
          if(!list) return;
          const idx = list.findIndex(o=>o.id===S.previewSel.id);
          if(idx<0) return;
          list.splice(idx,1);
          S.previewSel = null;
          drawStage(); bindLayout();
          renderOverlayPicker(wrap.querySelector("#globalOv"), S.globalOverlays, "global", redrawRight);
          if(activeSc) renderOverlayPicker(wrap.querySelector("#sceneOv"), activeSc.overlays, "scene", redrawRight);
          const gc = wrap.querySelector("#globalOvCount"); if(gc) gc.textContent = S.globalOverlays.filter(o=>o.selected).length + " 个已启用";
          const sh = wrap.querySelector("#sceneOvHint"); if(sh && activeSc) sh.textContent = sceneOverlayInheritHint(activeSc);
        };
      }
    }
    P.innerHTML = `<div class="pcard" style="padding:10px"><div class="row between" style="flex-wrap:wrap;gap:8px"><b style="font-size:12.5px">🎚 直接在画面上调整</b><div class="row" style="gap:8px">${deleteFn?'<button class="btn ghost sm" id="lyDel" style="color:var(--del)">删除选中贴片</button>':''}<button class="btn ghost sm" id="lyRec">推荐布局</button><span style="cursor:pointer;color:var(--teal);font-size:12px" id="lyReset">重置选中</span></div></div>
      <div class="muted" style="font-size:11.5px;margin-top:4px">当前：<b>${esc(selLabel)}</b> · 点击画布元素选中 · 拖动移动 · 拉圆点缩放</div></div>`;
    P.querySelector("#lyReset").onclick = resetFn;
    P.querySelector("#lyRec").onclick = applyRecommendedLayout;
    P.querySelector("#lyDel")?.addEventListener("click", deleteFn);
  }
  const redrawRight = ()=>{ drawStage(); bindLayout(); };
  setTimeout(()=>{
    drawStage(); bindLayout();
    renderOverlayPicker(wrap.querySelector("#globalOv"), S.globalOverlays, "global", redrawRight);
    const activeSc = S.scenes[S.buildSceneIdx];
    if(activeSc) renderOverlayPicker(wrap.querySelector("#sceneOv"), activeSc.overlays, "scene", redrawRight);
    const gc = wrap.querySelector("#globalOvCount");
    if(gc) gc.textContent = S.globalOverlays.filter(o=>o.selected).length + " 个已启用";
    const sh = wrap.querySelector("#sceneOvHint");
    if(sh && activeSc) sh.textContent = sceneOverlayInheritHint(activeSc);
    const note = wrap.querySelector("#pvNote");
    if(note) note.textContent = `${S.scenes.length} 个 Scene（与卖点 1:1）· 背景＝${stageBg(activeSc).label}`;
    const x = mid.querySelector(".banner .x"); if(x) x.onclick=()=>x.closest(".banner").remove();
  },0);
  return wrap;
}

  wrap.innerHTML = `<div class="banner" style="margin-bottom:12px"><span>✦</span><div><b>LIVE Storyboard（智能剧本）</b>：平台先给你一版整场安排说明；写下你的想法后可一键重新编排时间线。</div></div>
    <div class="three-col" style="grid-template-columns:1fr 320px;gap:14px">
      <div class="col" style="border:none;padding:0">
        <div class="pcard" style="margin-bottom:12px"><div class="between" style="margin-bottom:8px"><b>📄 平台推荐的直播安排</b><button class="btn ghost sm" id="sbRefresh">⟳ 刷新</button></div>
          <div class="sb-playbook" id="sbPlay">${esc(S.storyPlaybook).replace(/\n/g,"<br>")}</div></div>
        <div class="pcard sb-intent" style="margin-bottom:12px"><b style="display:block;margin-bottom:6px">✏️ 你的想法（选填）</b>
          <textarea id="sbIntent" placeholder="告诉 AI 你想怎么排这场直播，例如：前 3 分钟先讲优惠，后面强调送礼人群…">${esc(S.storyIntent)}</textarea>
          <button class="btn primary sm" id="sbReOrch" style="margin-top:8px">✨ 按我的想法重新编排</button></div>
        <div class="pcard" style="margin-bottom:12px"><b style="font-size:12.5px">卖点 ↔ Scene（1:1）</b>
          <ul class="muted" style="font-size:12.5px;margin:8px 0 0;padding-left:18px" id="sbSpList"></ul></div>
        <div class="pcard"><div class="col-h" style="padding:0 0 8px">Storyboard · 整场时间线</div><div id="tl"></div>

      </div>
      <div class="col" style="border:none;padding:0"><div class="pcard"><div class="col-h" style="padding:0 0 8px">Preview 9:16</div><div class="preview916" id="pv"></div>
        <div class="muted" style="font-size:11.5px;margin-top:8px" id="pvnote"></div></div></div>
    </div>`;
  setTimeout(()=>{
    const spList = wrap.querySelector("#sbSpList");
    S.scenes.forEach((sc,i)=>{ const li=el("li",null,`Scene ${i+1} · ${sc.title||("未命名卖点 "+(i+1))}`); spList.appendChild(li); });
    if(!S.scenes.length) spList.innerHTML = `<li>选品页尚未添加卖点，Storyboard 将按通用节奏编排。</li>`;
    wrap.querySelector("#sbIntent").oninput = e=>{ S.storyIntent = e.target.value; };
    wrap.querySelector("#sbRefresh").onclick = ()=>{ genStoryPlaybook(); render(); };
    wrap.querySelector("#sbReOrch").onclick = ()=>{
      genStoryPlaybook();
      if(S.storyIntent) S.storyPlaybook += "\n\n【商家补充】\n" + S.storyIntent;
      alert("（Demo）已按你的想法更新文字说明与时间线编排。");
      render();
    };
    const tlEl = wrap.querySelector("#tl"), pv = wrap.querySelector("#pv");
    const TK_NAME = { speech:"主播说话", visual:"画面", interaction:"观众互动", operation:"优惠 / 活动", voice:"声音", offscreen:"场外配音" };
    const SEG_NAME = { hook:"开场", body:"讲解", cta:"促单" };
    renderTimeline(tlEl, D.LIVEBRAIN, { audience:"seller", onPick:(tk,a)=>{ wrap.querySelector("#atomInfo").innerHTML = `<b>${TK_NAME[tk]||tk}</b> · ${a.start_sec}–${a.end_sec}s<br>${tk==="speech"?(SEG_NAME[a.segment]||"")+ "："+esc(a.text):esc(a.label||"")}`; }});
    const scrub = wrap.querySelector("#scrub"), tval = wrap.querySelector("#tval"), note = wrap.querySelector("#pvnote");
    const upd = ()=>{ const t=+scrub.value; tval.textContent=t+"s"; renderPreview916(pv, D.LIVEBRAIN, t, S.avatar);

// ---------------- Actionbar ----------------
function renderActionbar() {
  const seq = stepSeq(), bar = $("#actionbar"); bar.innerHTML="";
  // 给右下「💬 评论」浮标留出避让空间，避免遮挡 Save/Next
  bar.style.paddingRight = "160px";
  const big = "padding:11px 26px;font-size:14px;min-width:104px";
  const i = seq.indexOf(S.step);
  if(i>0){ const b=el("button","btn ghost","Previous"); b.style.cssText=big; b.onclick=()=>{S.step=seq[i-1];render();}; bar.appendChild(b); }
  const sv=el("button","btn ghost","Save"); sv.style.cssText=big; sv.onclick=()=>{ window.__dirty=false; UI && alert("已保存（Demo）。"); }; bar.appendChild(sv);
  if(S.step!=="mode" && i<seq.length-1){
    const valid = (S.step!==1 || S.avatar) && (S.step!==2 || S.products.length);
    const b=el("button","btn primary", S.step===5?"Done":"Next");
    b.style.cssText=big; b.disabled=!valid; b.onclick=()=>{ S.step=seq[i+1]; render(); };
    bar.appendChild(b);
  }
}

// ---------------- render ----------------
function render() {
  renderStepbar();
  $("#audNote").innerHTML = TIP[S.step] ? ("💡 " + TIP[S.step]) : "";
  const stage = $("#stage"); stage.innerHTML="";
  let node;
  if(S.step===1) node=renderStep1();
  else if(S.step===2) node=renderStep2();
  else if(S.step==="mode") node=renderMode();
  else if(S.step==="build") node=renderBuild();
  else if(S.step==="sb") node=renderSB();
  else if(S.step===5) node=renderStep5();
  stage.appendChild(node);
  renderActionbar();
  window.scrollTo(0,0);
}
