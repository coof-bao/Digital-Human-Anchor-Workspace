<script>
const { $, $$, el, esc, bg, modal, renderTimeline } = UI;
const D = DEMO;
let adopted = {}; // clip_index -> bool
let curTask = D.LIVE_TASKS[0];   // 当前选中的直播任务（shop × live_task）
let curView = "material";

const AUD = {
  material:"先定店铺 → 看各来源解析进度 → 按商品下钻 clips → 采纳回填商家端。每个 clip 必须归属具体商品。",

  script:"🧠 算法重点：L0 主 Agent 编排 + 6 职能 subagent 并行 → 直播大脑 JSON(多轨并发，显式[start,end])。⚙️研发：时间轴渲染组件、provenance 落点、shared_context 前缀缓存。",
  attr:"🧠 算法重点：以 room_id 为主键的直播监控 —— ① 脚本 diff(平台初稿 vs 商家确认稿，店铺×商品) ② 分钟级监控(消费侧信号 + 风控命中，合并到同一时间轴；归因/建议两套逻辑) → 诊断 → 人工确认改 prompt → 回归。",
  optimize:"🧪 脚本优化生产 & 测评【P0】：承接监控看板诊断/归因 → 优化 prompt 与生产 → 测评 2.0 回归。本页实时挂载《脚本生产与测评 Pipeline · 算法研发对齐稿》，源文档持续更新、本页自动同步。",
  flow:"⚙️研发：素材→剧本→归因流水线 + mode(classic/smart) 分桶看板。",

function taskProduct(){ return D.PRODUCTS.find(p=>p.id===curTask.product_id) || D.PRODUCTS[0]; }
function shopMaterialStats(){
  const totalPending = D.SOURCE_SUMMARY.reduce((s,x)=>s+(x.pending||0),0);
  const totalParsed = D.SOURCE_SUMMARY.reduce((s,x)=>s+(x.parsed||0),0);
  const totalSources = D.SOURCE_SUMMARY.reduce((s,x)=>s+(x.total||0),0);
  const totalClips = D.SOURCE_SUMMARY.reduce((s,x)=>s+(x.clips||0),0);
  return { totalPending, totalParsed, totalSources, totalClips };
}
function buildPendingQueue(){
  const fromRaw = D.ORIGINALS.filter(o=>!o.clip_count).map(o=>({
    id:o.id, file:o.file, source:o.source_label, source_kind:o.source,
    uploaded:o.uploaded, status:"queued", priority:"normal", note:o.note||"",
  }));
  const extra = [
    { id:"PEND-004", file:"商家新上传_开箱竖屏_42s.mp4", source:"商家本地上传", source_kind:"local_upload", uploaded:"2026-06-17", status:"processing", priority:"high", progress:62, note:"商家端 My assets · 本地上传回流" },
    { id:"PEND-005", file:"@7colorsbunny / 竖屏种草_18s.mp4", source:"关联 TikTok 已发布", source_kind:"tiktok_post", uploaded:"2026-06-16", status:"queued", priority:"normal", note:"TikTok 主页同步 · 待入队" },
    { id:"PEND-006", file:"LIVE_replay_20260612_互动高光.mp4", source:"近30天销量 TOP 直播录屏", source_kind:"history_live", uploaded:"2026-06-12", status:"failed", priority:"normal", note:"切片任务失败 · 可重试", error:"gemini timeout" },
  ];
  return fromRaw.concat(extra).sort((a,b)=> (a.status==="processing"?0:1) - (b.status==="processing"?0:1) || b.uploaded.localeCompare(a.uploaded));
}
function openPendingQueueModal(){
  const queue = buildPendingQueue();
  const body = el("div");
  body.innerHTML = `<div class="tipcard">待解析队列 · shop <code>${esc(D.SHOP.shop_id)}</code> · 商家端上传 / TikTok 同步 / 直播回放切片均在此排队；运营可设优先级或批量触发解析。</div>
    <table class="v2" style="margin-top:10px"><tr><th>素材</th><th>来源</th><th>提交</th><th>状态</th><th>操作</th></tr>
    ${queue.map(q=>{
      const st = q.status==="processing"? `<span class="tag gen">解析中 ${q.progress||0}%</span>`
        : q.status==="failed"? `<span class="tag live">失败</span><div class="muted" style="font-size:10px">${esc(q.error||"")}</div>`
        : `<span class="tag draft">排队中</span>`;
      const pri = q.priority==="high"? `<span class="chip" style="background:#fff3cd;color:#d97706;margin-left:4px">优先</span>` : "";
      return `<tr><td><div style="font-weight:600;font-size:12.5px">${esc(q.file)}</div><div class="muted" style="font-size:10.5px"><code>${esc(q.id)}</code>${pri}</div></td>
        <td>${esc(q.source)}</td><td>${esc(q.uploaded)}</td><td>${st}</td>
        <td><button class="btn ghost sm" data-parse="${esc(q.id)}">${q.status==="failed"?"重试":"立即解析"}</button></td></tr>`;
    }).join("")}
    </table>
    <div class="muted" style="font-size:11.5px;margin-top:8px">共 <b>${queue.length}</b> 条 · 其中处理中 ${queue.filter(q=>q.status==="processing").length} · 失败 ${queue.filter(q=>q.status==="failed").length}</div>`;
  const foot = el("div","row");
  foot.style.cssText = "gap:8px;justify-content:flex-end";
  foot.innerHTML = `<button class="btn ghost sm" data-no>关闭</button><button class="btn primary sm" data-batch>批量解析排队项</button>`;
  const dlg = modal("待解析队列 · "+esc(D.SHOP.shop_name), body, foot, "modal-wide");
  foot.querySelector("[data-no]").onclick = dlg.close;
  foot.querySelector("[data-batch]").onclick = ()=>{ alert("（Demo）已触发 shop "+D.SHOP.shop_id+" 批量解析任务，完成后 clips 进入 Clip Bank。"); dlg.close(); };
  body.querySelectorAll("[data-parse]").forEach(b=>b.onclick = ()=>{ alert("（Demo）已触发单条解析："+b.dataset.parse); });
}
function openSourceManageModal(){
  const body = el("div");
  body.innerHTML = `<div class="tipcard">来源管理 · shop <code>${esc(D.SHOP.shop_id)}</code> · 配置三类素材源的接入、同步策略与解析开关（运营 / 研发视图）。</div>
    <div class="grid3" style="margin-top:12px">
    ${D.SOURCE_SUMMARY.map(s=>{
      const pct = s.total? Math.round(s.parsed/s.total*100) : 0;
      return `<div class="pcard"><div class="row between"><b>${s.icon} ${esc(s.label)}</b><span class="tag ${s.pending?"draft":"ready"}">${s.pending?("待解析 "+s.pending):"已全解析"}</span></div>
        <div class="muted" style="font-size:11.5px;margin:8px 0">${esc(s.extra)}</div>
        <div class="row" style="gap:10px;margin-bottom:8px"><div><div style="font-size:20px;font-weight:800">${s.parsed}/${s.total}</div><div class="muted" style="font-size:10px">已解析</div></div>
          <div><div style="font-size:20px;font-weight:800;color:var(--teal)">${s.clips}</div><div class="muted" style="font-size:10px">clips</div></div></div>
        <div class="meter" style="height:6px;margin-bottom:10px"><i style="width:${pct}%"></i></div>
        <div class="row" style="gap:6px;flex-wrap:wrap">
          <button class="btn ghost sm" data-sync="${esc(s.source)}">同步 / 刷新</button>
          <button class="btn ghost sm" data-cfg="${esc(s.source)}">解析配置</button>
          ${s.pending? `<button class="btn primary sm" data-parse-src="${esc(s.source)}">解析待处理 (${s.pending})</button>`:""}
        </div></div>`;
    }).join("")}
    </div>
    <div class="banner" style="margin-top:12px"><span>ℹ️</span><div><b>商家端入口映射</b><div class="muted" style="font-size:11.5px">本地上传 ↔ My assets · 上传视频 ｜ TikTok ↔ 账号授权同步 ｜ 直播回放 ↔ room_id 高光切片 pipeline</div></div></div>`;
  const foot = el("div");
  foot.innerHTML = `<button class="btn ghost sm" data-no>关闭</button>`;
  const dlg = modal("来源管理 · "+esc(D.SHOP.shop_name), body, foot, "modal-wide");
  foot.querySelector("[data-no]").onclick = dlg.close;
  body.querySelectorAll("[data-sync]").forEach(b=>b.onclick=()=>alert("（Demo）已触发 "+b.dataset.sync+" 同步任务"));
  body.querySelectorAll("[data-cfg]").forEach(b=>b.onclick=()=>alert("（Demo）打开 "+b.dataset.cfg+" 解析配置（抽帧/模型/打标阈值）"));
  body.querySelectorAll("[data-parse-src]").forEach(b=>b.onclick=()=>{ alert("（Demo）已对该来源待处理项批量入队"); openPendingQueueModal(); dlg.close(); });
}
function renderTaskbar(){
  const tb = $("#taskbar");
  if(curView==="material"){
    const st = shopMaterialStats();
    tb.innerHTML = `
      <div><div class="muted" style="font-size:11px">Shop · 素材域</div><b>${esc(D.SHOP.shop_name)}</b> <span class="muted" style="font-size:11.5px">@${esc(D.SHOP.handle)} · <code>${esc(D.SHOP.shop_id)}</code></span></div>
      <div style="border-left:1px solid var(--line);padding-left:16px"><div class="muted" style="font-size:11px">当前模块</div><b>Material Studio</b> <span class="chip" style="background:var(--teal-50);color:var(--teal)">整店素材</span></div>
      <div style="border-left:1px solid var(--line);padding-left:16px"><div class="muted" style="font-size:11px">店级概览</div>
        <span class="chip">${D.PRODUCTS.length} 商品</span> <span class="tag draft">${st.totalPending} 待解析</span> <span class="tag ready">${st.totalClips} clips</span></div>
      <div style="margin-left:auto" class="muted" style="font-size:11px">素材按 <code>shop_id</code> 组织 · 非单场 live_task 限定</div>`;
    return;
  }
  tb.innerHTML = `
    <div><div class="muted" style="font-size:11px">Shop</div><b>${esc(D.SHOP.shop_name)}</b> <span class="muted" style="font-size:11.5px">@${esc(D.SHOP.handle)} · ${D.SHOP.shop_id}</span></div>
    <div style="border-left:1px solid var(--line);padding-left:16px"><div class="muted" style="font-size:11px">Live task（直播任务）</div>
      <select id="taskSel" style="padding:6px 10px;border:1px solid var(--grey-300);border-radius:8px;font-weight:700;max-width:340px"></select></div>
    <div><div class="muted" style="font-size:11px">主推商品</div><b>${esc(taskProduct().ip)}</b></div>
    <div><div class="muted" style="font-size:11px">模式 / 状态</div><span class="chip">${curTask.mode==='smart'?'智能剧本':'分步引导'}</span> <span class="tag ${curTask.status==='已开播'?'ready':'draft'}">${esc(curTask.status)}</span></div>
    <div style="margin-left:auto" class="muted" style="font-size:11px">数据均按 <code>shop_id × live_task_id</code> 维度组织</div>`;
  const sel = tb.querySelector("#taskSel");
  D.LIVE_TASKS.forEach(t=>{ const o=el("option",null,`${t.task_id} · ${t.name}`); o.value=t.task_id; if(t.task_id===curTask.task_id) o.selected=true; sel.appendChild(o); });
  sel.onchange = ()=>{ curTask = D.LIVE_TASKS.find(t=>t.task_id===sel.value); VIEWS[curView](); renderTaskbar(); };
}

// ---------------- D-P1 Material Studio ----------------
function clipProductId(c, bank){
  const k = bank.source + c.clip_index;
  if(clipProductOverrides[k]) return clipProductOverrides[k];
  return c.product_id || bank.product_id || taskProduct().id;
}
function productById(id){ return D.PRODUCTS.find(p=>p.id===id) || taskProduct(); }
function clipDrawer(bank, c) {
  const mismatch = c.asr_lang && c.asr_lang !== "en";
  const pid = clipProductId(c, bank);
  const prod = productById(pid);
  const strongTip = c.clip_type === "strong"
    ? `<div class="tipcard" style="margin:10px 0;background:var(--teal-50);border-color:var(--teal-200)"><b style="color:var(--teal)">强卖点片段</b><div style="font-size:12px;margin-top:6px;line-height:1.65">画面与口播都在<b>主动讲这个商品的核心好处</b>，适合当主讲解镜。与普通展示（bg）不同：bg 只是商品出镜、不一定在卖；risk 则不建议使用。</div></div>`
    : (c.clip_type === "bg"
      ? `<div class="muted" style="font-size:12px;margin:10px 0;line-height:1.6">泛展示片段：商品或场景出镜，但不一定在讲卖点，可作背景或过渡。</div>`
      : `<div class="muted" style="font-size:12px;margin:10px 0;line-height:1.6;color:var(--del)">不推荐片段：画面/口播与商品弱相关或存在合规风险，默认不采纳。</div>`);
  const body = el("div");
  body.innerHTML = `<div class="grid2">
    <div><div class="thumb-wrap"><div class="thumb wide" style="${bg(c.thumbUrl)};border-radius:10px;aspect-ratio:9/16"></div><span class="dur-badge">${c.start_time_sec}s–${c.start_time_sec+c.duration_sec}s</span></div>
      <div class="muted" style="font-size:11.5px;margin-top:6px">来源视频 source_index=${c.source_index} · ${esc(bank.original)}</div></div>
    <div>
      <div class="row" style="gap:6px;flex-wrap:wrap"><span class="tag ${c.clip_type}">${c.clip_type}</span>${c.highlight?'<span class="chip" style="background:#fff3cd;color:#d97706">★ 高光</span>':''}<span class="chip">layer: ${c.visual_layer}</span></div>
      ${strongTip}
      <div class="banner" style="margin:10px 0 6px"><span>${bank.src_icon||'🎞'}</span><div><b>归属商品：${esc(prod.ip)}</b><div class="muted" style="font-size:11.5px">Product ID ${prod.id}</div></div></div>
      <div class="row" style="gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><span class="muted" style="font-size:12px">改归属：</span><select id="clipProdSel" style="flex:1;min-width:180px;padding:6px 8px;border:1px solid var(--grey-300);border-radius:8px">${D.PRODUCTS.map(p=>`<option value="${p.id}"${p.id===pid?" selected":""}>${esc(p.ip)} · ${p.id}</option>`).join("")}</select></div>
      <div class="banner" style="margin:0 0 6px"><span>${bank.src_icon||'🎞'}</span><div><b>素材来源：${esc(bank.src_label||bank.source)}</b><div class="muted" style="font-size:11.5px">${esc(bank.original)}</div></div></div>
      <p style="margin:10px 0 6px;font-weight:600">${esc(c.visual_content)}</p>
      <div style="margin:6px 0">${c.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
      <table class="v2" style="margin-top:8px">
        <tr><th>来源类型</th><td>${esc(bank.src_label||bank.source)}（${bank.src_kind==="local_upload"?"商家本地上传":bank.src_kind==="tiktok_post"?"关联 TikTok 已发布":bank.src_kind==="history_live"?"近30天销量 TOP 直播录屏":bank.src_kind==="live_replay"?"直播录屏":bank.source}）</td></tr>
        <tr><th>product_id</th><td><code>${pid}</code></td></tr>
        <tr><th>clip_id</th><td><code>${c.clip_id}</code></td></tr>
        <tr><th>规格</th><td>${c.resolution||"1080×1920"} · ${(c.fps||30)}fps · ${c.codec||"H.264"}${c.size_mb!=null?(" · "+c.size_mb+"MB"):""}</td></tr>
        <tr><th>start / duration</th><td>${c.start_time_sec}s / ${c.duration_sec}s · 解析硬约束：最短 30s</td></tr>
        <tr><th>clip_type</th><td>${c.clip_type}（strong=强卖点 / bg=泛展示 / risk=不可用）</td></tr>
        <tr><th>selling_point</th><td>${esc(c.selling_point)}</td></tr>
        <tr><th>visual_content</th><td>${esc(c.visual_content)}</td></tr>
        <tr><th>asr_content</th><td class="muted">${esc(c.asr_content)}</td></tr>
        <tr><th>asr_lang</th><td>${c.asr_lang? (mismatch?`<span class="tag draft">${c.asr_lang} · ⚠ lang_mismatch</span>`:`<span class="tag ready">${c.asr_lang} ✓ 与场次语言一致</span>`) : '<span class="muted">null（has_speech=false / 占位）</span>'}</td></tr>
        <tr><th>recommend_use / layer</th><td>${c.recommend_use} → ${c.visual_layer}</td></tr>
        <tr><th>relevance</th><td>${c.relevance}</td></tr>
        <tr><th>product_match_score</th><td><div class="row" style="gap:8px;align-items:center"><div class="meter ${c.match_score>=90?'hi':c.match_score<50?'lo':''}" style="flex:1"><i style="width:${c.match_score}%"></i></div><b>${c.product_match_score}</b></div><div class="muted" style="font-size:11px;margin-top:4px">建议卡匹配度：越高越适合挂到该商品讲解卡片</div></td></tr>
        <tr><th>match_reason</th><td>${esc(c.match_reason)}<div class="muted" style="font-size:11px;margin-top:4px">同步至商家端「为什么推荐」</div></td></tr>
        <tr><th>provenance</th><td><details><summary style="cursor:pointer;font-size:12px">展开技术溯源</summary><span class="muted">${c.clip_id} · parsed by gemini-3-pro-preview-new · ${esc(bank.source)}</span></details></td></tr>
      </table>
    </div></div>`;
  const foot = el("div");
  foot.innerHTML = `<button class="btn ghost sm">改标签</button><button class="btn ghost sm">合并/拆分</button>
    <button class="btn ${adopted[bank.source+c.clip_index]?'ghost':'primary'} sm" data-adopt>${adopted[bank.source+c.clip_index]?'✓ 已采纳（取消）':'采纳 → 回填商家端 My assets·Clips'}</button>`;
  const dlg = modal("Clip 详情 · "+c.clip_id+" · "+esc(prod.ip), body, foot);
  body.querySelector("#clipProdSel")?.addEventListener("change", e=>{
    clipProductOverrides[bank.source+c.clip_index] = e.target.value;
    c.product_id = e.target.value;
    dlg.close(); renderMaterial();
  });
  foot.querySelector("[data-adopt]").onclick = ()=>{ const k=bank.source+c.clip_index; adopted[k]=!adopted[k]; dlg.close(); renderMaterial(); };
}
const SRC_ICON = { local_upload:"⬆️", tiktok_post:"🔗", history_live:"📺", live_replay:"📺" };
let matSearchMode = "product";
let matProdQuery = "";
let matProdQueryActive = "";
let matClipQuery = "";
let matClipQueryActive = "";
let clipProductOverrides = {};
let matJumpProductId = null;
// 把所有 bank 的 clips 摊平、带上各自 bank（来源），用于「商品维度」聚合
function allProductClips(){
  return [D.CLIPS_M1, D.CLIPS_M2, D.CLIPS_LIVE].flatMap(b=>b.clips.map(c=>({ c, bank:b })))
    .sort((a,b)=>(b.c.match_score||0)-(a.c.match_score||0));
}
function renderMaterial() {
  const stage=$("#stage"); stage.innerHTML="";
  const adoptedCount = Object.values(adopted).filter(Boolean).length;
  const st = shopMaterialStats();
  stage.appendChild(el("div","between",`<div><div class="h-title">🎬 Material Studio</div><div class="sub-title">店 → 整体解析 → 商品 → clips · 采纳回填商家端</div></div><span class="tag ready">已采纳 ${adoptedCount}</span>`));
  stage.appendChild(el("div","note",AUD.material));

}

  const j = el("div","pcard"); j.style.marginTop="14px";

    <div class="tipcard" style="margin:10px 0">
      <b>一句话：这份契约定义「同一时刻多条轨道怎么叠在一起」——画面谁盖谁、声音谁压谁。</b>

      <div style="margin-top:6px"><b>③ ducking（自动让音）：</b>高优先级的声音一响（如口播、场外音催单），背景乐 / 提示音自动压低，说完再恢复——就像主播说话时音乐自动变小。</div>
    </div>
    <pre style="background:var(--grey-50);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px">${esc(JSON.stringify(D.LIVEBRAIN.timeline.render_contract,null,2))}</pre>

  stage.appendChild(j);
}

function renderAttrS2(box){

  box.appendChild(el("div","tipcard","组织维度＝<b>店铺ID → 商品ID</b>。「平台初稿 vs 商家确认稿」按 <b>商品 → 卖点 → 每个卖点的 Hook/Body/CTA</b> 逐段比对：商家改了什么 → 归因诊断 → 直接给出<b>可粘贴的提示词修改（前→后原句）</b>。商家保存即唯一「喂数据」动作。"));
  box.appendChild(el("div","",`<div class="muted" style="font-size:11.5px;margin-top:12px">Shop <code>${esc(D.SHOP.shop_id)}</code> × Product <code>1732323410271768766</code></div><div class="h-title" style="font-size:16px;margin-top:2px">📦 ${esc(s2.product)}</div><div class="sub-title">共 ${s2.points.length} 个卖点 · 每个卖点含 Hook / Body / CTA</div>`));

}
// 分钟级监控：消费侧信号 + 风控命中「合并到同一条时间轴」（room_id 维度）；归因/建议两套逻辑
function renderAttrS3(box){
  const minStart = (m)=>{ const n = (m||"").match(/\d+/); return n? +n[0] : 0; };
  // 合并两路为同一时间轴：消费侧（kind=consume）+ 风控（kind=risk），按分钟排序
  const merged = [
    ...D.ATTR.s3.filter(r=>!r.risk).map(r=>({ kind:"consume", ...r })),
    ...D.ATTR.risk.map(r=>({ kind:"risk", ...r })),
  ].sort((a,b)=>minStart(a.min)-minStart(b.min));

  box.appendChild(el("div","tipcard",`组织维度＝<b>商家ID → 直播 Room <code>${curTask.room_id?esc(curTask.room_id):'—'}</code></b>。消费侧信号与风控命中<b>合并在同一条时间轴</b>上按分钟对齐；归因定位与建议是<b>两套逻辑</b>（消费侧＝优化转化/互动；风控＝反向归因 Violation Code + 禁词校验，对齐合规知识库 §10.2）。`));

  const t=el("div","pcard"); t.style.marginTop="12px";
  t.innerHTML = `<div class="row between"><b>分钟级监控时间轴（消费侧 × 风控 合并）</b><span class="muted" style="font-size:11.5px">🟦 消费侧　🟥 风控命中</span></div>
    <table class="v2" style="margin-top:8px"><tr><th style="width:8%">分钟</th><th style="width:9%">类型</th><th style="width:20%">信号 / 命中</th><th style="width:25%">归因定位</th><th>建议 / 提示词修改（前→后）</th></tr>
    ${merged.map(r=>{
      if(r.kind==="risk"){
        return `<tr style="background:#fff5f5"><td>${esc(r.min)}</td>
          <td><span class="tag live">⚠ 风控</span></td>
          <td><span class="tag live">${esc(r.code)}</span><div class="muted" style="font-size:11px;margin-top:3px">${esc(r.rule)}</div></td>
          <td>${esc(r.reason)}</td>
          <td>${esc(r.fix)}<div class="muted" style="font-size:11px;text-decoration:line-through;opacity:.7;margin-top:4px">${esc(r.prompt_before)}</div><div style="margin-top:3px;font-size:11.5px;color:#86198f">↳ <code style="background:#fae8ff;padding:1px 4px;border-radius:4px">${esc(r.prompt_after)}</code></div></td></tr>`;
      }
      return `<tr><td>${esc(r.min)}</td>
        <td><span class="tag ready">🟦 消费侧</span></td>
        <td>${r.signal.map(s=>`${esc(s.t)} ${dirTag(s.d)}`).join(" ")}</td>
        <td>${esc(r.locate)}</td>
        <td>${esc(r.suggest)}${r.prompt?`<div style="margin-top:4px;font-size:11.5px;color:#86198f">↳ <code style="background:#fae8ff;padding:1px 4px;border-radius:4px">${esc(r.prompt)}</code></div>`:''}</td></tr>`;
    }).join("")}
    </table>
    <div class="muted" style="font-size:11.5px;margin-top:6px">同一时间轴对齐，便于看「某分钟掉转化 / 命中风控」与生产侧轨道·原子的对应关系；消费侧给优化 prompt，风控给整改 + 禁词校验。</div>`;
  box.appendChild(t);
  // 诊断 + 改 prompt
  const d = el("div","pcard"); d.style.marginTop="14px";
  d.innerHTML = `<div class="between"><b>诊断报告 → 人工确认改 prompt</b><span class="tag draft">待确认</span></div>
    <div class="tipcard" style="margin:10px 0">主因：12' 转化下滑＝<b>运营 overlay 价格牌出现过晚</b>；28' 命中<b>误导价格(#16)</b>。建议：price_tag 提前到品 0s 常驻 + CTA 禁用绝对化价格词。</div>
    <div class="row" style="gap:10px"><button class="btn primary sm" onclick="alert('（Demo）已写入 prompt 迭代队列，进入测评 2.0 回归')">确认并更新 prompt</button><button class="btn ghost sm">忽略</button></div>`;
  box.appendChild(d);
}
